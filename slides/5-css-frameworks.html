<span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>

<span class="hljs-comment">&lt;!-- サイズ変更 --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ul</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;pagination pagination-lg&quot;</span>&gt;</span><span class="hljs-comment">&lt;!-- 大きい --&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ul</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;pagination pagination-sm&quot;</span>&gt;</span><span class="hljs-comment">&lt;!-- 小さい --&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="progress%E3%83%97%E3%83%AD%E3%82%B0%E3%83%AC%E3%82%B9%E3%83%90%E3%83%BC">Progress（プログレスバー）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- 基本のプログレスバー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress&quot;</span> <span class="hljs-attr">role</span>=<span class="hljs-string">&quot;progressbar&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress-bar&quot;</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;width: 25%&quot;</span>&gt;</span>25%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- 色付きプログレスバー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress mt-3&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress-bar bg-success&quot;</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;width: 50%&quot;</span>&gt;</span>50%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- 縞模様のプログレスバー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress mt-3&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress-bar progress-bar-striped&quot;</span>
       <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;width: 60%&quot;</span>&gt;</span>60%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- アニメーション付き --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress mt-3&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;progress-bar progress-bar-striped progress-bar-animated&quot;</span>
       <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;width: 75%&quot;</span>&gt;</span>読み込み中...<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="spinner%E3%82%B9%E3%83%94%E3%83%8A%E3%83%BC%E3%83%BB%E3%83%AD%E3%83%BC%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0">Spinner（スピナー・ローディング）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- 基本のスピナー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-border&quot;</span> <span class="hljs-attr">role</span>=<span class="hljs-string">&quot;status&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;visually-hidden&quot;</span>&gt;</span>読み込み中...<span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- 色付きスピナー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-border text-primary&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-border text-success&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-border text-danger&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- 成長するスピナー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-grow text-primary&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- ボタン内のスピナー --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;btn btn-primary&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;button&quot;</span> <span class="hljs-attr">disabled</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">span</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner-border spinner-border-sm&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">span</span>&gt;</span>
  読み込み中...
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-2-%E3%81%BE%E3%81%A8%E3%82%81">Lesson 2 まとめ</h2>
<h3 id="%E5%AD%A6%E3%82%93%E3%81%A0%E3%81%93%E3%81%A8-1">学んだこと</h3>
<ul>
<li><strong>Navbar</strong>: レスポンシブナビゲーション、ハンバーガーメニュー</li>
<li><strong>Modal</strong>: モーダルダイアログ、サイズ変更、フォームの組み込み</li>
<li><strong>Form</strong>: フォーム要素のスタイリング、バリデーションスタイル</li>
<li><strong>Carousel</strong>: 画像スライダー、自動再生</li>
<li><strong>その他</strong>: Badge、Breadcrumb、Pagination、Progress、Spinner</li>
</ul>
<h3 id="%E9%87%8D%E8%A6%81%E3%81%AA%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88">重要なポイント</h3>
<ul>
<li><code>data-bs-*</code> 属性で JavaScript を書かずに動的な機能が使える</li>
<li>ID の一致が重要</li>
<li>Bootstrap JavaScript が必須</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-3">Lesson 3</h1>
<h1 id="tailwind-css-%E5%9F%BA%E7%A4%8E-%F0%9F%8C%8A">Tailwind CSS 基礎 <img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f30a.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-3-tailwind-css-%E5%9F%BA%E7%A4%8E-%F0%9F%8C%8A-1">Lesson 3: Tailwind CSS 基礎 <img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f30a.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：Tailwind CSS の基本を理解し、ユーティリティファーストのアプローチで、カスタマイズ性の高い UI を爆速で作れるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-tailwind-css-%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ Tailwind CSS を学ぶの?</h3>
<h4 id="bootstrap-%E3%81%AE%E6%82%A9%E3%81%BF">Bootstrap の悩み</h4>
<div class="demerit">
<ul>
<li>独自のデザインを作りたいけど、カスタマイズが難しい</li>
<li>使わないコンポーネントも読み込まれて、ファイルサイズが大きい</li>
<li>細かい調整をしたいけど、カスタム CSS を書くのが面倒</li>
</ul>
</div>
<h4 id="tailwind-css-%E3%81%AE%E7%89%B9%E5%BE%B4">Tailwind CSS の特徴</h4>
<ul>
<li><strong>ユーティリティファースト</strong>: 小さな部品（クラス）を組み合わせて作る</li>
<li><strong>完全カスタマイズ可能</strong>: 独自のデザインが簡単に作れる（Bootstrap っぽさゼロ）</li>
<li><strong>超軽量</strong>: 使った分だけ CSS が生成される</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3%E3%83%95%E3%82%A1%E3%83%BC%E3%82%B9%E3%83%88%E3%81%A8%E3%81%AF">ユーティリティファーストとは?</h2>
<h3 id="%E3%82%B3%E3%83%B3%E3%83%9D%E3%83%BC%E3%83%8D%E3%83%B3%E3%83%88%E3%83%99%E3%83%BC%E3%82%B9%E3%81%AE-css">コンポーネントベースの CSS</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;btn btn-primary&quot;</span>&gt;</span>ボタン<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> <code>btn</code> や <code>btn-primary</code> という<strong>完成されたコンポーネント</strong>を使う</p>
<h3 id="tailwind-css%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3%E3%83%95%E3%82%A1%E3%83%BC%E3%82%B9%E3%83%88">Tailwind CSS（ユーティリティファースト）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600&quot;</span>&gt;</span>
  ボタン
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<p><img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/> <code>bg-blue-500</code>（背景色）、<code>text-white</code>（文字色）、<code>px-4</code>（左右パディング）など、<strong>小さなユーティリティクラス</strong>を組み合わせて作る</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="tailwind-css-%E3%81%AE%E5%B0%8E%E5%85%A5cdn-%E3%81%A7%E8%B6%85%E7%B0%A1%E5%8D%98">Tailwind CSS の導入：CDN で超簡単！</h2>
<p>Tailwind CSS を使うには、<strong>たった 1 行追加するだけ</strong>！<strong>Play CDN</strong>（= 開発・学習用の CDN）を使って、インストール・設定ファイル不要、ですぐに試せる</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</span> <span class="hljs-attr">content</span>=<span class="hljs-string">&quot;width=device-width, initial-scale=1.0&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>Tailwind CSS 入門<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>

    <span class="hljs-comment">&lt;!-- Tailwind CSS Play CDN（これを追加するだけ！） --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.tailwindcss.com&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-3xl font-bold text-blue-600&quot;</span>&gt;</span>
      Hello, Tailwind CSS!
    <span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<p><strong>注意</strong>：本番環境では、ビルドツールを使った方が良い（ファイルサイズを最小化できる）。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%9C%80%E5%88%9D%E3%81%AE-tailwind-%E3%83%9C%E3%82%BF%E3%83%B3">最初の Tailwind ボタン</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- 通常のボタン（Tailwind なし） --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span>&gt;</span>普通のボタン<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Tailwind ボタン --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-500 text-white px-6 py-3 rounded hover:bg-blue-600 transition&quot;</span>&gt;</span>
  Primary ボタン
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-green-500 text-white px-6 py-3 rounded hover:bg-green-600 ml-2 transition&quot;</span>&gt;</span>
  Success ボタン
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<h4 id="%E3%82%AF%E3%83%A9%E3%82%B9%E5%90%8D%E3%81%AE%E8%AA%AD%E3%81%BF%E6%96%B9">クラス名の読み方</h4>
<ul>
<li><code>bg-blue-500</code>: 背景色を青（500の濃さ）</li>
<li><code>text-white</code>: 文字色を白</li>
<li><code>px-6</code>: 左右のパディング（1.5rem = 24px）</li>
<li><code>py-3</code>: 上下のパディング（0.75rem = 12px）</li>
<li><code>rounded</code>: 角を丸く</li>
<li><code>hover:bg-blue-600</code>: ホバー時に背景色を濃く</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3%E3%82%AF%E3%83%A9%E3%82%B9%E3%81%AE%E5%9F%BA%E6%9C%AC">ユーティリティクラスの基本</h2>
<p>Tailwind CSS の<strong>最も重要な概念</strong>を理解しよう！</p>
<h3 id="%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA%E3%83%91%E3%82%BF%E3%83%BC%E3%83%B3">基本的なパターン</h3>
<p>Tailwind のクラス名は、以下のパターンで構成されているよ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">{property}-{value}
</code></pre>
<h4 id="%E4%BE%8B">例</h4>
<ul>
<li><code>text-center</code>: text-align: center</li>
<li><code>font-bold</code>: font-weight: bold</li>
<li><code>bg-red-500</code>: background-color: #ef4444</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%88%E3%81%8F%E4%BD%BF%E3%81%86%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3%E3%82%AF%E3%83%A9%E3%82%B9">よく使うユーティリティクラス</h2>
<h3 id="%E3%82%B9%E3%83%9A%E3%83%BC%E3%82%B7%E3%83%B3%E3%82%B0%E4%BD%99%E7%99%BD-1">スペーシング（余白）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- margin（外側の余白） --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;m-4 border&quot;</span>&gt;</span>全方向マージン<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mt-4 border&quot;</span>&gt;</span>上マージン<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mb-4 border&quot;</span>&gt;</span>下マージン<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mx-4 border&quot;</span>&gt;</span>左右マージン<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;my-4 border&quot;</span>&gt;</span>上下マージン<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-comment">&lt;!-- padding（内側の余白） --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;p-4 border&quot;</span>&gt;</span>全方向パディング<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;px-4 border&quot;</span>&gt;</span>左右パディング<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;py-4 border&quot;</span>&gt;</span>上下パディング<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<h4 id="%E6%95%B0%E5%80%A4%E3%81%AE%E5%AF%BE%E5%BF%9C%E8%A1%A8">数値の対応表</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">0 = 0px
1 = 0.25rem (4px)
2 = 0.5rem (8px)
3 = 0.75rem (12px)
4 = 1rem (16px)
6 = 1.5rem (24px)
8 = 2rem (32px)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E3%82%AB%E3%83%A9%E3%83%BC">カラー</h3>
<p>Tailwind CSS には、<strong>豊富なカラーパレット</strong>が用意されている</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>背景色<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-gray-100 m-4 p-4&quot;</span>&gt;</span>bg-gray-100: 薄いグレー<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-500 m-4 p-4&quot;</span>&gt;</span>bg-blue-500: 青<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-green-500 m-4 p-4&quot;</span>&gt;</span>bg-green-500: 緑<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-red-500 m-4 p-4&quot;</span>&gt;</span>bg-red-500: 赤<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>文字色<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600 m-4 p-4&quot;</span>&gt;</span>text-gray-600: グレー文字<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-blue-500 m-4 p-4&quot;</span>&gt;</span>text-blue-500: 青文字<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-red-500 m-4 p-4&quot;</span>&gt;</span>text-red-500: 赤文字<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>ボーダー色<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border border-gray-300 m-4 p-4&quot;</span>&gt;</span>border-gray-300: グレーの枠線<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border border-blue-500 m-4 p-4&quot;</span>&gt;</span>border-blue-500: 青の枠線<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<p><strong>色の濃さ</strong>: <code>50</code>（最も薄い）〜 <code>900</code>（最も濃い）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E3%81%A8%E3%83%95%E3%82%A9%E3%83%B3%E3%83%88">テキストとフォント</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>フォントサイズ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xs m-4&quot;</span>&gt;</span>text-xs: 極小テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-sm m-4&quot;</span>&gt;</span>text-sm: 小テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-base m-4&quot;</span>&gt;</span>text-base: 通常テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-lg m-4&quot;</span>&gt;</span>text-lg: 大テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xl m-4&quot;</span>&gt;</span>text-xl: 特大テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-2xl m-4&quot;</span>&gt;</span>text-2xl: 超特大テキスト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>フォントウェイト<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;font-light m-4&quot;</span>&gt;</span>font-light: 細字<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;font-normal m-4&quot;</span>&gt;</span>font-normal: 通常<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;font-bold m-4&quot;</span>&gt;</span>font-bold: 太字<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>テキスト配置<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-left m-4&quot;</span>&gt;</span>text-left: 左寄せ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-center m-4&quot;</span>&gt;</span>text-center: 中央寄せ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-right m-4&quot;</span>&gt;</span>text-right: 右寄せ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E5%B9%85%E3%81%A8%E9%AB%98%E3%81%95">幅と高さ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>固定幅<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-32 bg-gray-300 m-4 p-2&quot;</span>&gt;</span>w-32: 幅 8rem (128px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-64 bg-gray-300 m-4 p-2&quot;</span>&gt;</span>w-64: 幅 16rem (256px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>パーセント幅<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-1/2 bg-gray-300 m-4 p-2&quot;</span>&gt;</span>w-1/2: 幅 50%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-1/3 bg-gray-300 m-4 p-2&quot;</span>&gt;</span>w-1/3: 幅 33.333%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-full bg-gray-300 my-4 p-2&quot;</span>&gt;</span>w-full: 幅 100%<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>画面幅・高さ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-screen bg-gray-300 my-4 p-2&quot;</span>&gt;</span>w-screen: 画面幅いっぱい<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;h-screen bg-gray-300 m-4 p-2&quot;</span>&gt;</span>h-screen: 画面高さいっぱい<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>最大幅<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;max-w-sm bg-gray-300 m-4 p-2&quot;</span>&gt;</span>max-w-sm: 最大幅 24rem (384px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;max-w-md bg-gray-300 m-4 p-2&quot;</span>&gt;</span>max-w-md: 最大幅 28rem (448px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;max-w-lg bg-gray-300 m-4 p-2&quot;</span>&gt;</span>max-w-lg: 最大幅 32rem (512px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E3%83%9C%E3%83%BC%E3%83%80%E3%83%BC%E3%81%A8%E8%A7%92%E4%B8%B8">ボーダーと角丸</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>ボーダー<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border m-4 p-4&quot;</span>&gt;</span>border: 1px ボーダー<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border-2 m-4 p-4&quot;</span>&gt;</span>border-2: 2px ボーダー<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border-4 m-4 p-4&quot;</span>&gt;</span>border-4: 4px ボーダー<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>角丸<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;rounded bg-gray-200 m-4 p-4&quot;</span>&gt;</span>rounded: 角丸 (4px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;rounded-lg bg-gray-200 m-4 p-4&quot;</span>&gt;</span>rounded-lg: 大角丸 (8px)<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;rounded-full bg-gray-200 m-4 p-4&quot;</span>&gt;</span>rounded-full: 完全な円<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>影<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;shadow bg-gray-50 m-4 p-4&quot;</span>&gt;</span>shadow: 小さい影<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;shadow-md bg-gray-50 m-4 p-4&quot;</span>&gt;</span>shadow-md: 中影<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;shadow-lg bg-gray-50 m-4 p-4&quot;</span>&gt;</span>shadow-lg: 大きい影<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3">レスポンシブデザイン</h2>
<p>Tailwind CSS の<strong>レスポンシブデザイン</strong>は超シンプル！</p>
<h3 id="%E3%83%96%E3%83%AC%E3%83%BC%E3%82%AF%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88">ブレークポイント</h3>
<ul>
<li>デフォルト = スマホ</li>
<li><code>md:</code>、<code>lg:</code> で大きい画面用のスタイルを追加</li>
</ul>
<table>
<thead>
<tr>
<th>プレフィックス</th>
<th>画面幅</th>
<th>デバイス例</th>
</tr>
</thead>
<tbody>
<tr>
<td>なし（デフォルト）</td>
<td>すべて</td>
<td>全デバイス</td>
</tr>
<tr>
<td><code>sm:</code></td>
<td>≥ 640px</td>
<td>スマホ（横）</td>
</tr>
<tr>
<td><code>md:</code></td>
<td>≥ 768px</td>
<td>タブレット</td>
</tr>
<tr>
<td><code>lg:</code></td>
<td>≥ 1024px</td>
<td>PC（小）</td>
</tr>
<tr>
<td><code>xl:</code></td>
<td>≥ 1280px</td>
<td>PC（中）</td>
</tr>
<tr>
<td><code>2xl:</code></td>
<td>≥ 1536px</td>
<td>PC（大）</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%81%AE%E5%AE%9F%E4%BE%8B-1">レスポンシブの実例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-red-500 md:bg-blue-500 lg:bg-green-500 m-4 p-4&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>スマホ:赤、タブレット:青、PC:緑<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-sm lg:text-2xl border m-4 p-4&quot;</span>&gt;</span>

<h3 id="%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%82%AB%E3%83%BC%E3%83%89%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88">レスポンシブカードレイアウト</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-white rounded-lg shadow-lg overflow-hidden&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://placehold.jp/400x200.png&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;Card 1&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-full&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;p-6&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">h2</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xl font-bold mb-2&quot;</span>&gt;</span>カード 1<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600&quot;</span>&gt;</span>
        スマホ:1列、タブレット:2列、PC:3列で表示されます。
      <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- 他のカードも同様 --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<p><strong>クラスの読み方</strong>:</p>
<ul>
<li><code>grid</code>: Grid レイアウトを有効化</li>
<li><code>grid-cols-1</code>: 1列（デフォルト = スマホ）</li>
<li><code>md:grid-cols-2</code>: 768px以上で2列</li>
<li><code>lg:grid-cols-3</code>: 1024px以上で3列</li>
<li><code>gap-6</code>: カード間の余白（1.5rem = 24px）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">

<h3 id="flexbox-%E3%82%AF%E3%83%A9%E3%82%B9%E4%B8%80%E8%A6%A7">Flexbox クラス一覧</h3>
<table>
<thead>
<tr>
<th>クラス</th>
<th>CSS</th>
<th>説明</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>flex</code></td>
<td><code>display: flex</code></td>
<td>Flexbox を有効化</td>
</tr>
<tr>
<td><code>flex-row</code></td>
<td><code>flex-direction: row</code></td>
<td>横並び（デフォルト）</td>
</tr>
<tr>
<td><code>flex-col</code></td>

<td>縦並び</td>
</tr>
<tr>

</tr>
<tr>
<td><code>justify-center</code></td>

<td>中央寄せ</td>
</tr>
<tr>
<td><code>justify-end</code></td>
<td><code>justify-content: flex-end</code></td>
<td>右寄せ</td>
</tr>
<tr>
<td><code>justify-between</code></td>

<td>両端寄せ</td>
</tr>
<tr>
<td><code>items-center</code></td>

<td>縦方向中央寄せ</td>
</tr>
<tr>
<td><code>gap-4</code></td>

<td>要素間の余白</td>
</tr>
</tbody>
</table>
</section>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 m-4&quot;</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-purple-500 text-white p-4 rounded&quot;</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<h2 id="%E7%96%91%E4%BC%BC%E3%82%AF%E3%83%A9%E3%82%B9-%E3%83%9B%E3%83%90%E3%83%BC%E3%82%84%E3%83%95%E3%82%A9%E3%83%BC%E3%82%AB%E3%82%B9">疑似クラス: ホバーやフォーカス</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>ホバー効果: hover:bg-blue-700 hover:scale-105<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-500 text-white px-6 py-3 rounded
               hover:bg-blue-700 hover:scale-105 transition m-4&quot;</span>&gt;</span>
  ホバーしてみて！
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>フォーカス効果: focus:border-blue-500<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;クリックしてフォーカス&quot;</span>
       <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border-2 border-gray-300 px-4 py-2 rounded
              focus:border-blue-500 m-4&quot;</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>グループホバー: group<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;group bg-white p-6 rounded-lg shadow-lg
            hover:shadow-2xl transition cursor-pointer m-4&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h3</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-xl font-bold transition&quot;</span>&gt;</span>
    カードタイトル
  <span class="hljs-tag">&lt;/<span class="hljs-name">h3</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600 mt-2 group-hover:text-blue-500&quot;</span>&gt;</span>
    group-hover:text-blue-500: 親要素にホバーすると、このテキストの色が変わります。
  <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E7%96%91%E4%BC%BC%E3%82%AF%E3%83%A9%E3%82%B9%E3%83%97%E3%83%AC%E3%83%95%E3%82%A3%E3%83%83%E3%82%AF%E3%82%B9">疑似クラスプレフィックス</h3>
<table>
<thead>
<tr>
<th>プレフィックス</th>
<th>説明</th>
<th>例</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>hover:</code></td>
<td>ホバー時</td>
<td><code>hover:bg-blue-600</code></td>
</tr>
<tr>
<td><code>focus:</code></td>
<td>フォーカス時</td>
<td><code>focus:border-blue-500</code></td>
</tr>
<tr>
<td><code>active:</code></td>
<td>アクティブ時（クリック中）</td>
<td><code>active:scale-95</code></td>
</tr>
<tr>
<td><code>disabled:</code></td>
<td>無効時</td>
<td><code>disabled:opacity-50</code></td>
</tr>
<tr>
<td><code>group-hover:</code></td>
<td>親がホバーされた時</td>
<td><code>group-hover:text-blue-500</code></td>
</tr>
</tbody>
</table>
<p><strong>transition</strong> クラスで、滑らかなアニメーション効果を追加できる!</p>
</section>

<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8Btailwind-css-%E3%81%A7%E4%BD%9C%E3%82%8B%E7%BE%8E%E3%81%97%E3%81%84%E3%83%A9%E3%83%B3%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0%E3%83%9A%E3%83%BC%E3%82%B8-%F0%9F%9A%80">実践例：Tailwind CSS で作る美しいランディングページ <img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f680.svg" data-marp-twemoji=""/></h2>
<p>これまで学んだことを全部使って、本格的なランディングページを作ってみよう！</p>
<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>

<h2 id="lesson-3-%E3%81%BE%E3%81%A8%E3%82%81">Lesson 3 まとめ</h2>
<h3 id="%E5%AD%A6%E3%82%93%E3%81%A0%E3%81%93%E3%81%A8-2">学んだこと</h3>
<ul>
<li><strong>Tailwind CSS とは</strong>: ユーティリティファーストのフレームワーク</li>
<li><strong>導入方法</strong>: Play CDN で簡単導入（<code>&lt;script&gt;</code> タグ1行だけ）</li>
<li><strong>ユーティリティクラス</strong>: スペーシング、カラー、テキスト、幅・高さ、ボーダー</li>
<li><strong>レスポンシブデザイン</strong>: モバイルファースト、<code>sm:</code>、<code>md:</code>、<code>lg:</code> プレフィックス</li>
<li><strong>Flexbox と Grid</strong>: <code>flex</code>、<code>grid</code> クラス</li>
<li><strong>疑似クラス</strong>: <code>hover:</code>、<code>focus:</code>、<code>transition</code></li>
</ul>
<p><strong>メディアクエリ不要で、レスポンシブ完成!</strong> <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f389.svg" data-marp-twemoji=""/></p>
</section>

<h2 id="tailwind-css-%E3%81%AE%E3%82%AB%E3%82%B9%E3%82%BF%E3%83%9E%E3%82%A4%E3%82%BA%E8%A8%AD%E5%AE%9A">Tailwind CSS のカスタマイズ設定</h2>
<h3 id="cdn%E7%89%88-vs-%E3%83%93%E3%83%AB%E3%83%89%E7%89%88">CDN版 vs ビルド版</h3>
<table>
<thead>
<tr>
<th>項目</th>
<th>CDN版</th>
<th>ビルド版</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>読み込み方法</strong></td>
<td><code>&lt;script&gt;</code> タグで読み込み</td>
<td>npm install + ビルドツール</td>
</tr>
<tr>
<td><strong>カスタマイズ方法</strong></td>
<td>HTMLに<code>&lt;script&gt;</code>で直接記述</td>
<td><code>tailwind.config.js</code>ファイル</td>
</tr>
<tr>
<td><strong>ビルド必要?</strong></td>
<td>不要</td>
<td>必要</td>
</tr>
<tr>
<td><strong>本番環境で使う?</strong></td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 推奨しない</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 推奨</td>
</tr>
<tr>
<td><strong>ファイルサイズ</strong></td>
<td>大きい</td>
<td>小さい（使用分のみ）</td>
</tr>
<tr>
<td><strong>学習のしやすさ</strong></td>
<td><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/> 超簡単！</td>
<td><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/> セットアップが必要</td>

<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>Tailwind カスタマイズ<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>

  <span class="hljs-comment">&lt;!-- 1. CDN を読み込む --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.tailwindcss.com&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>

  <span class="hljs-comment">&lt;!-- 2. すぐ後にカスタム設定を追加 --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    tailwind.<span class="hljs-property">config</span> = {
      <span class="hljs-attr">theme</span>: {
        <span class="hljs-attr">extend</span>: {
          <span class="hljs-comment">// ここにカスタマイズを追加</span>
          <span class="hljs-attr">colors</span>: {
            <span class="hljs-comment">// ブランドカラーを追加</span>
            <span class="hljs-attr">brand</span>: {
              <span class="hljs-number">50</span>: <span class="hljs-string">&#x27;#e6f7ff&#x27;</span>,
              <span class="hljs-number">100</span>: <span class="hljs-string">&#x27;#bae7ff&#x27;</span>,
              <span class="hljs-number">200</span>: <span class="hljs-string">&#x27;#91d5ff&#x27;</span>,
              <span class="hljs-number">300</span>: <span class="hljs-string">&#x27;#69c0ff&#x27;</span>,
              <span class="hljs-number">400</span>: <span class="hljs-string">&#x27;#40a9ff&#x27;</span>,
              <span class="hljs-number">500</span>: <span class="hljs-string">&#x27;#1890ff&#x27;</span>,  <span class="hljs-comment">// メインカラー</span>
              <span class="hljs-number">600</span>: <span class="hljs-string">&#x27;#096dd9&#x27;</span>,
              <span class="hljs-number">700</span>: <span class="hljs-string">&#x27;#0050b3&#x27;</span>,
              <span class="hljs-number">800</span>: <span class="hljs-string">&#x27;#003a8c&#x27;</span>,
              <span class="hljs-number">900</span>: <span class="hljs-string">&#x27;#002766&#x27;</span>,
            },
            <span class="hljs-comment">// シンプルに1色だけ追加</span>
            <span class="hljs-attr">primary</span>: <span class="hljs-string">&#x27;#1890ff&#x27;</span>,
            <span class="hljs-attr">secondary</span>: <span class="hljs-string">&#x27;#52c41a&#x27;</span>,
            <span class="hljs-attr">danger</span>: <span class="hljs-string">&#x27;#ff4d4f&#x27;</span>,
          },
        },
      },
    }
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- カスタムカラーが使える！ --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-primary text-brand-50
                 px-6 py-3 rounded-lg m-4&quot;</span>&gt;</span>
    ブランドカラーのボタン
  <span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>

<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%80%E3%83%BC%E3%82%AF%E3%83%A2%E3%83%BC%E3%83%89%E3%81%AE%E5%AE%9F%E8%A3%85-%F0%9F%8C%99">ダークモードの実装 <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f319.svg" data-marp-twemoji=""/></h2>
<h3 id="%E3%83%80%E3%83%BC%E3%82%AF%E3%83%A2%E3%83%BC%E3%83%89%E3%81%AE%E6%9C%89%E5%8A%B9%E5%8C%96cdn%E7%89%88">ダークモードの有効化（CDN版）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.tailwindcss.com&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
  tailwind.<span class="hljs-property">config</span> = {
    <span class="hljs-attr">darkMode</span>: <span class="hljs-string">&#x27;class&#x27;</span>,  <span class="hljs-comment">// &#x27;class&#x27; または &#x27;media&#x27;</span>
  }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<ul>
<li><strong><code>'class'</code></strong>: 手動で切り替え（<code>&lt;html class=&quot;dark&quot;&gt;</code> を追加/削除）</li>
<li><strong><code>'media'</code></strong>: OS の設定に従う（自動）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="dark-%E3%83%97%E3%83%AC%E3%83%95%E3%82%A3%E3%83%83%E3%82%AF%E3%82%B9%E3%81%AE%E4%BD%BF%E3%81%84%E6%96%B9">dark: プレフィックスの使い方</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- ライトモード：白背景＋黒文字、ダークモード：黒背景＋白文字 --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-white dark:bg-gray-900
            text-gray-900 dark:text-white p-8&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-3xl font-bold mb-4&quot;</span>&gt;</span>ダークモード対応<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600 dark:text-gray-400&quot;</span>&gt;</span>
    ダークモードに自動的に対応したコンテンツです。
  <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-500 dark:bg-blue-600 text-white px-6 py-3 rounded-lg&quot;</span>&gt;</span>
    ボタン
  <span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E6%89%8B%E5%8B%95%E3%81%A7%E3%83%80%E3%83%BC%E3%82%AF%E3%83%A2%E3%83%BC%E3%83%89%E3%82%92%E5%88%87%E3%82%8A%E6%9B%BF%E3%81%88%E3%82%8B">手動でダークモードを切り替える</h3>
<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</span>
        <span class="hljs-attr">content</span>=<span class="hljs-string">&quot;width=device-width, initial-scale=1.0&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>ダークモード切り替え<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.tailwindcss.com&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    tailwind.<span class="hljs-property">config</span> = {
      <span class="hljs-attr">darkMode</span>: <span class="hljs-string">&#x27;class&#x27;</span>,
    }
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">body</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-white dark:bg-gray-900 text-gray-900
             dark:text-white min-h-screen&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container mx-auto px-4 py-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex justify-between items-center mb-8&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-3xl font-bold&quot;</span>&gt;</span>ダークモード対応アプリ<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">button</span>
        <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;theme-toggle&quot;</span>
        <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-lg&quot;</span>&gt;</span>
        <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f319.svg" data-marp-twemoji=""/> ダークモード切り替え
      <span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-gray-100 dark:bg-gray-800 p-6 rounded-lg&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">h2</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-2xl font-bold mb-4&quot;</span>&gt;</span>カードタイトル<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600 dark:text-gray-400&quot;</span>&gt;</span>
        ダークモードに対応したカードコンテンツです。
      <span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

  <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
    <span class="hljs-keyword">const</span> toggle = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;theme-toggle&#x27;</span>);
    <span class="hljs-keyword">const</span> html = <span class="hljs-variable language_">document</span>.<span class="hljs-property">documentElement</span>;

    toggle.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-function">() =&gt;</span> {
      html.<span class="hljs-property">classList</span>.<span class="hljs-title function_">toggle</span>(<span class="hljs-string">&#x27;dark&#x27;</span>);
      <span class="hljs-comment">// ローカルストレージに保存</span>
      <span class="hljs-keyword">if</span> (html.<span class="hljs-property">classList</span>.<span class="hljs-title function_">contains</span>(<span class="hljs-string">&#x27;dark&#x27;</span>)) {
        <span class="hljs-variable language_">localStorage</span>.<span class="hljs-property">theme</span> = <span class="hljs-string">&#x27;dark&#x27;</span>;
        toggle.<span class="hljs-property">textContent</span> = <span class="hljs-string">&#x27;<img class="emoji" draggable="false" alt="☀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2600.svg" data-marp-twemoji=""/> ライトモード切り替え&#x27;</span>;
      } <span class="hljs-keyword">else</span> {
        <span class="hljs-variable language_">localStorage</span>.<span class="hljs-property">theme</span> = <span class="hljs-string">&#x27;light&#x27;</span>;
        toggle.<span class="hljs-property">textContent</span> = <span class="hljs-string">&#x27;<img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f319.svg" data-marp-twemoji=""/> ダークモード切り替え&#x27;</span>;
      }
    });

    <span class="hljs-comment">// ページ読み込み時にテーマを復元</span>
    <span class="hljs-keyword">if</span> (<span class="hljs-variable language_">localStorage</span>.<span class="hljs-property">theme</span> === <span class="hljs-string">&#x27;dark&#x27;</span>) {
      html.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&#x27;dark&#x27;</span>);
      toggle.<span class="hljs-property">textContent</span> = <span class="hljs-string">&#x27;<img class="emoji" draggable="false" alt="☀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2600.svg" data-marp-twemoji=""/> ライトモード切り替え&#x27;</span>;
    }
  </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="%E3%83%80%E3%83%BC%E3%82%AF%E3%83%A2%E3%83%BC%E3%83%89%E3%81%AE%E3%82%AB%E3%83%A9%E3%83%BC%E8%A8%AD%E8%A8%88">ダークモードのカラー設計</h3>
<table>
<thead>
<tr>
<th>要素</th>
<th>ライトモード</th>
<th>ダークモード</th>
</tr>
</thead>
<tbody>
<tr>
<td>背景</td>
<td><code>bg-white</code></td>
<td><code>dark:bg-gray-900</code></td>
</tr>
<tr>
<td>2nd 背景</td>
<td><code>bg-gray-100</code></td>
<td><code>dark:bg-gray-800</code></td>
</tr>
<tr>
<td>テキスト</td>
<td><code>text-gray-900</code></td>
<td><code>dark:text-white</code></td>
</tr>
<tr>
<td>2nd テキスト</td>
<td><code>text-gray-600</code></td>
<td><code>dark:text-gray-400</code></td>
</tr>
<tr>
<td>ボーダー</td>
<td><code>border-gray-300</code></td>
<td><code>dark:border-gray-700</code></td>
</tr>
</tbody>
</table>
<p><strong>例</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;border p-6 rounded-lg
            bg-white border-gray-300  
            dark:bg-gray-900 dark:border-gray-700&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">h3</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-900 dark:text-white font-bold mb-2&quot;</span>&gt;</span>タイトル<span class="hljs-tag">&lt;/<span class="hljs-name">h3</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-600 dark:text-gray-400&quot;</span>&gt;</span>説明文<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%EF%BC%86%E3%83%88%E3%83%A9%E3%83%B3%E3%82%B8%E3%82%B7%E3%83%A7%E3%83%B3-%E2%9C%A8">アニメーション＆トランジション <img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></h2>
<h3 id="transition-%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3">transition ユーティリティ</h3>
<p>スムーズな変化を実現する <code>transition</code> クラス</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>全てのプロパティに transition<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:bg-red-300 hover:scale-110 transition m-4 p-4&quot;</span>&gt;</span>
  Hover してみて
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>特定のプロパティだけ transition<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:bg-red-300 transition-colors m-4 p-4&quot;</span>&gt;</span>
  transition-colors: 色だけ変化
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:scale-110 transition-transform m-4 p-4&quot;</span>&gt;</span>
  transition-transform: 拡大するボタン
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>duration と ease のカスタマイズ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:bg-red-300 transition duration-1000 ease-in-out m-4 p-4&quot;</span>&gt;</span>
  duration-1000 ease-in-out: ゆっくり変化
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transformscalerotatetranslate">transform（scale/rotate/translate）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>拡大: hover:scale-125<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:scale-125 transition m-4 p-4&quot;</span>&gt;</span>
  1.25 倍に拡大
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>回転: hover:rotate-45<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:rotate-45 transition m-4 p-4&quot;</span>&gt;</span>
  45 度回転
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>移動: hover:translate-x-8<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:translate-x-8 transition m-4 p-4&quot;</span>&gt;</span>
  右に 2rem 移動
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>組み合わせ: hover:scale-110 hover:-translate-y-2 hover:rotate-3<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;bg-blue-300 hover:scale-110 hover:-translate-y-2
               hover:rotate-3 transition m-4 p-4&quot;</span>&gt;</span>
  複合的な変化
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E7%9A%84%E3%81%AA%E3%83%86%E3%82%AF%E3%83%8B%E3%83%83%E3%82%AF">実践的なテクニック</h2>
<h3 id="peer-%E3%81%A8-peer-checked">peer と peer-checked</h3>
<p>input に <code>peer</code>、兄弟要素に <code>peer-checked:</code> を付けると、input の状態に応じて兄弟要素のスタイルが変わる</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>チェックボックスの状態に応じて、ラベルに取り消し線<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex items-center space-x-3 m-4&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;checkbox&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;task&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;peer w-5 h-5 text-blue-500 rounded&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;task&quot;</span>
         <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;text-gray-700 peer-checked:text-blue-500 peer-checked:line-through&quot;</span>&gt;</span>
    peer-checked: ラベル
  <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>ラジオボタンの状態に応じて、ラベルの色を変更<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;flex items-center space-x-3 m-4&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;color&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;blue&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;peer&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;cursor-pointer peer-checked:text-blue-500&quot;</span>&gt;</span>
    peer-checked: ラベル
  <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</section>

<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;w-[217px] h-[42px] border m-4 p-2&quot;</span>&gt;</span>

<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>任意のマージン<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;mt-[13px] mb-[7.5rem] border&quot;</span>&gt;</span>

<h2 id="lesson-4-%E3%81%BE%E3%81%A8%E3%82%81">Lesson 4 まとめ</h2>
<h3 id="%E5%AD%A6%E3%82%93%E3%81%A0%E3%81%93%E3%81%A8-3">学んだこと</h3>
<ul>
<li><strong>カスタマイズ設定</strong>: CDN版とビルド版の違い、カスタムカラーの追加</li>
<li><strong>ダークモード</strong>: <code>dark:</code> プレフィックスで簡単に対応</li>
<li><strong>アニメーション</strong>: transition、transform、animate- クラス</li>
<li><strong>実践テクニック</strong>: peer/peer-checked、arbitrary values</li>
