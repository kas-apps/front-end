<h3 id="%E6%9C%80%E3%82%82%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB%E3%81%AA%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0">最もシンプルなフォーム</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">form</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>お名前: <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">br</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;email&quot;</span>&gt;</span>メールアドレス: <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;email&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">br</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;submit&quot;</span>&gt;</span>送信<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
</code></pre>
<h6 id="%E3%81%9F%E3%81%A3%E3%81%9F%E3%81%93%E3%82%8C%E3%81%A0%E3%81%91%E3%81%A7%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%BC%E3%81%8C%E6%83%85%E5%A0%B1%E3%82%92%E5%85%A5%E5%8A%9B%E3%81%A7%E3%81%8D%E3%82%8B%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0%E3%81%AE%E5%AE%8C%E6%88%90-%F0%9F%8E%89">たったこれだけで、ユーザーが情報を入力できるフォームの完成！ <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f389.svg" data-marp-twemoji=""/></h6>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="form-%E3%82%BF%E3%82%B0"><code>&lt;form&gt;</code> タグ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;/submit&quot;</span> <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;POST&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- フォームの内容がここに入る --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
</code></pre>
<ul>
<li><strong>役割</strong>：フォーム全体を囲む箱</li>
<li><strong>action</strong>：送信先の URL</li>
<li><strong>method</strong>：送信方法（<code>GET</code> または <code>POST</code>）</li>
</ul>
<p><strong>例え話</strong>：紙のアンケート用紙全体。この中に質問と回答欄が入る。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="input-%E3%82%BF%E3%82%B0"><code>&lt;input&gt;</code> タグ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>役割</strong>：ユーザーが情報を入力する欄</li>
<li><strong>type 属性</strong>：入力の種類を指定（超重要！）</li>
<li><strong>name 属性</strong>：データを送信する時の名前</li>
<li><strong>id 属性</strong>：label との関連付け用</li>
</ul>
<p><strong>例え話</strong>：アンケート用紙の「回答欄」。種類によって、テキスト欄だったり、チェックボックスだったり。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="label-%E3%82%BF%E3%82%B0"><code>&lt;label&gt;</code> タグ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;email&quot;</span>&gt;</span>メールアドレス:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;email&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>役割</strong>：入力欄の説明文</li>
<li><strong>for 属性</strong>：対応する input の <code>id</code> を指定</li>
<li><strong>必須度</strong>：<img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⭐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b50.svg" data-marp-twemoji=""/>（アクセシビリティのため必須！）</li>
</ul>
<p><strong>例え話</strong>：アンケート用紙の「質問文」。何を入力すればいいか示す。</p>
<p><strong>重要！</strong> label と input を関連付けると：</p>
<ul>
<li>label をクリックしても input にフォーカスできる（便利！）</li>
<li>スクリーンリーダーが正しく読み上げる（アクセシビリティ向上！）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="input-%E3%81%AE%E6%A7%98%E3%81%AA%E3%82%BF%E3%82%A4%E3%83%97"><code>&lt;input&gt;</code> の様々なタイプ</h2>
<p><code>type</code> 属性を変えると、入力欄の種類が変わるよ！</p>
<table>
<thead>
<tr>
<th>type</th>
<th>用途</th>
<th>特徴</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>text</code></td>
<td>1 行テキスト</td>
<td>名前、住所など</td>
</tr>
<tr>
<td><code>email</code></td>
<td>メールアドレス</td>
<td>スマホで<code>@</code>入りキーボード、形式チェック</td>
</tr>
<tr>
<td><code>password</code></td>
<td>パスワード</td>
<td>入力が<code>⚫︎⚫︎⚫︎⚫︎</code>で隠れる</td>
</tr>
<tr>
<td><code>number</code></td>
<td>数値</td>
<td>上下ボタン、数値キーボード</td>
</tr>
<tr>
<td><code>date</code></td>
<td>日付</td>
<td>カレンダーから選択</td>
</tr>
<tr>
<td><code>tel</code></td>
<td>電話番号</td>
<td>電話番号キーボード</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="input-%E3%81%AE%E6%A7%98%E3%81%AA%E3%82%BF%E3%82%A4%E3%83%97%E7%B6%9A%E3%81%8D"><code>&lt;input&gt;</code> の様々なタイプ（続き）</h2>
<table>
<thead>
<tr>
<th>type</th>
<th>用途</th>
<th>特徴</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>url</code></td>
<td>URL</td>
<td>URL 形式をチェック</td>
</tr>
<tr>
<td><code>checkbox</code></td>
<td>チェックボックス</td>
<td>複数選択可能</td>
</tr>
<tr>
<td><code>radio</code></td>
<td>ラジオボタン</td>
<td>1 つだけ選択可能</td>
</tr>
<tr>
<td><code>file</code></td>
<td>ファイル選択</td>
<td>画像、PDF などのアップロード</td>
</tr>
</tbody>
</table>
<h5 id="%E8%A1%A8input-%E3%81%AE%E6%A7%98%E3%81%AA%E3%82%BF%E3%82%A4%E3%83%97">表：<code>&lt;input&gt;</code> の様々なタイプ</h5>
<h6 id="type-%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B%E3%81%A0%E3%81%91%E3%81%A7%E3%82%B9%E3%83%9E%E3%83%9B%E3%81%AE%E3%82%AD%E3%83%BC%E3%83%9C%E3%83%BC%E3%83%89%E3%82%82%E8%87%AA%E5%8B%95%E3%81%A7%E6%9C%80%E9%81%A9%E5%8C%96%E3%81%95%E3%82%8C%E3%82%8B%F0%9F%93%B1">type を変えるだけで、スマホのキーボードも自動で最適化される！<img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/></h6>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="checkbox-%E3%81%A8-radio-%E3%81%AE%E9%81%95%E3%81%84">checkbox と radio の違い</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- チェックボックス（複数選択可能） --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>興味のある分野を選んでください。<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;checkbox&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;interests&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;coding&quot;</span>&gt;</span>プログラミング
<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;checkbox&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;interests&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;design&quot;</span>&gt;</span>デザイン
<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-comment">&lt;!-- ラジオボタン（1 つだけ選択可能） --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>性別を選んでください。<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;female&quot;</span>&gt;</span>女性
<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;male&quot;</span>&gt;</span>男性
<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;radio&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;gender&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;other&quot;</span>&gt;</span>その他
<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
</code></pre>
<p><strong>重要！</strong> radio は同じ <code>name</code> 属性を持つと、1 つだけ選択可能になる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%81%9D%E3%81%AE%E4%BB%96%E3%81%AE%E5%85%A5%E5%8A%9B%E8%A6%81%E7%B4%A0">その他の入力要素</h2>
<h3 id="textarea---%E8%A4%87%E6%95%B0%E8%A1%8C%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88"><code>&lt;textarea&gt;</code> - 複数行テキスト</h3>
<p>長い文章の入力（お問い合わせ内容、コメントなど）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;message&quot;</span>&gt;</span>メッセージ:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">textarea</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;message&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;message&quot;</span> <span class="hljs-attr">rows</span>=<span class="hljs-string">&quot;5&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">textarea</span>&gt;</span>
</code></pre>
<h3 id="select---%E3%83%89%E3%83%AD%E3%83%83%E3%83%97%E3%83%80%E3%82%A6%E3%83%B3%E3%83%AA%E3%82%B9%E3%83%88"><code>&lt;select&gt;</code> - ドロップダウンリスト</h3>
<p>多くの選択肢から 1 つを選ぶ</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;country&quot;</span>&gt;</span>国:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">select</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;country&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;country&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;&quot;</span>&gt;</span>選択してください<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;jp&quot;</span>&gt;</span>日本<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;us&quot;</span>&gt;</span>アメリカ<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">select</span>&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="html5-%E3%83%90%E3%83%AA%E3%83%87%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E5%B1%9E%E6%80%A7">HTML5 バリデーション属性</h2>
<p>フォームに入力制限を付けて、間違った入力を防ごう！</p>
<h3 id="required---%E5%BF%85%E9%A0%88%E9%A0%85%E7%9B%AE"><code>required</code> - 必須項目</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
</code></pre>
<ul>
<li>空欄のまま送信できない</li>
</ul>
<h3 id="minlength-maxlength---%E6%96%87%E5%AD%97%E6%95%B0%E5%88%B6%E9%99%90"><code>minlength</code>, <code>maxlength</code> - 文字数制限</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;password&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;password&quot;</span> <span class="hljs-attr">minlength</span>=<span class="hljs-string">&quot;8&quot;</span> <span class="hljs-attr">maxlength</span>=<span class="hljs-string">&quot;20&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>minlength</strong>：最小文字数</li>
<li><strong>maxlength</strong>：最大文字数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="html5-%E3%83%90%E3%83%AA%E3%83%87%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E5%B1%9E%E6%80%A7%E7%B6%9A%E3%81%8D">HTML5 バリデーション属性（続き）</h2>
<h3 id="min-max---%E6%95%B0%E5%80%A4%E7%AF%84%E5%9B%B2"><code>min</code>, <code>max</code> - 数値範囲</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;number&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;age&quot;</span> <span class="hljs-attr">min</span>=<span class="hljs-string">&quot;18&quot;</span> <span class="hljs-attr">max</span>=<span class="hljs-string">&quot;120&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>min</strong>：最小値</li>
<li><strong>max</strong>：最大値</li>
</ul>
<h3 id="pattern---%E6%AD%A3%E8%A6%8F%E8%A1%A8%E7%8F%BE%E3%83%91%E3%82%BF%E3%83%BC%E3%83%B3"><code>pattern</code> - 正規表現パターン</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;zipcode&quot;</span> <span class="hljs-attr">pattern</span>=<span class="hljs-string">&quot;\d{3}-\d{4}&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;123-4567&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>pattern</strong>：正規表現で入力形式を指定</li>
<li><strong>例</strong>：
<ul>
<li><code>\d{3}-\d{4}</code>：3 桁-4 桁（郵便番号）</li>
<li><code>[a-zA-Z0-9]+</code>：英数字のみ</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="html5-%E3%83%90%E3%83%AA%E3%83%87%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E5%B1%9E%E6%80%A7%E7%B6%9A%E3%81%8D-1">HTML5 バリデーション属性（続き）</h2>
<h3 id="placeholder---%E5%85%A5%E5%8A%9B%E4%BE%8B%E3%81%AE%E8%A1%A8%E7%A4%BA"><code>placeholder</code> - 入力例の表示</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;email&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;email@example.com&quot;</span>&gt;</span>
</code></pre>
<ul>
<li><strong>効果</strong>：入力欄に薄く例を表示（ヒント）</li>
</ul>
<div class="caution">
<ul>
<li><strong>注意</strong>：placeholder は label の代わりにならない！必ず label も付けよう</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%8C%E5%85%A8%E7%89%88%E3%81%AE%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0%E4%BE%8B">完全版のフォーム例</h2>
<p>ここまで学んだことを全部使った、実践的なお問い合わせフォーム：</p>
<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>お問い合わせフォーム<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>お問い合わせフォーム<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;/submit&quot;</span> <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;POST&quot;</span>&gt;</span>
      <span class="hljs-comment">&lt;!-- 名前 --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;name&quot;</span>&gt;</span>お名前（必須）:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;name&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- メールアドレス --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;email&quot;</span>&gt;</span>メールアドレス（必須）:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">input</span>
          <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;email&quot;</span>
          <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;email&quot;</span>
          <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;email&quot;</span>
          <span class="hljs-attr">required</span>
          <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;example@email.com&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- 電話番号 --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;phone&quot;</span>&gt;</span>電話番号:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;tel&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;phone&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;phone&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;090-1234-5678&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- お問い合わせ種類 --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;category&quot;</span>&gt;</span>お問い合わせ種類:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">select</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;category&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;category&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;&quot;</span>&gt;</span>選択してください<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;product&quot;</span>&gt;</span>製品について<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;support&quot;</span>&gt;</span>サポート<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;other&quot;</span>&gt;</span>その他<span class="hljs-tag">&lt;/<span class="hljs-name">option</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">select</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- メッセージ --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;message&quot;</span>&gt;</span>メッセージ（必須）:<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">textarea</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;message&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;message&quot;</span> <span class="hljs-attr">rows</span>=<span class="hljs-string">&quot;5&quot;</span> <span class="hljs-attr">required</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">textarea</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- 利用規約同意 --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">label</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;checkbox&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;agree&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;yes&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
          利用規約に同意します
        <span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>

      <span class="hljs-comment">&lt;!-- 送信ボタン --&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;submit&quot;</span>&gt;</span>送信<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-1-html-%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A0%E3%81%BE%E3%81%A8%E3%82%81">Lesson 1: HTML フォームまとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>フォームの基本構造</strong>（<code>&lt;form&gt;</code>, <code>&lt;label&gt;</code>, <code>&lt;input&gt;</code>）</li>
<li><strong>様々な input タイプ</strong>（text, email, password, checkbox など）</li>
<li><strong>label と input の正しい関連付け</strong>（アクセシビリティ）</li>
<li><strong>その他の入力要素</strong>（<code>&lt;textarea&gt;</code>, <code>&lt;select&gt;</code>）</li>
<li><strong>HTML5 バリデーション</strong>（required, minlength, pattern など）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-%EF%BC%92">Lesson ２</h1>
<h1 id="flexbox---%E6%9F%94%E8%BB%9F%E3%81%AA-1-%E6%AC%A1%E5%85%83%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88-%F0%9F%93%A6">Flexbox - 柔軟な 1 次元レイアウト <img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-2-flexbox---%E6%9F%94%E8%BB%9F%E3%81%AA-1-%E6%AC%A1%E5%85%83%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88-%F0%9F%93%A6-1">Lesson 2: Flexbox - 柔軟な 1 次元レイアウト <img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：Flexbox を使って、要素を柔軟に配置できるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-flexbox-%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ Flexbox を学ぶの？</h3>
<p>Phase 1 で学んだ CSS では、要素を横に並べたり、中央に配置したりするのが結構大変だったよね。</p>
<p><strong>Flexbox を使うと、こんなレイアウトが簡単に作れる！</strong> <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
<ul>
<li>要素を横並びにする（縦並びも！）</li>
<li>要素を中央に配置する</li>
<li>要素の間隔を均等にする</li>
<li>要素の高さを揃える</li>
<li>スマホでは縦並び、PC では横並びに切り替える</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="flexbox-%E3%81%AE%E5%9F%BA%E6%9C%AC%E6%A6%82%E5%BF%B5">Flexbox の基本概念</h2>
<h3 id="flexbox-%E3%81%A8%E3%81%AF">Flexbox とは？</h3>
<p><strong>Flexbox（フレキシブルボックスレイアウト）</strong> は、<strong>1 次元</strong>のレイアウトシステムだよ。</p>
<p><strong>「1 次元」ってどういうこと？</strong></p>
<ul>
<li><strong>横方向（行）</strong> または <strong>縦方向（列）</strong> のどちらか一方に要素を並べる</li>
<li>「横と縦を同時に」ではなく、「横だけ」「縦だけ」を扱う</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">【1次元レイアウト = Flexbox】
横方向：
□ □ □ □

縦方向：
□
□
□
□
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="flex-container-%E3%81%A8-flex-item">Flex Container と Flex Item</h2>
<h3 id="flex-container%E8%A6%AA%E8%A6%81%E7%B4%A0">Flex Container（親要素）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- これがflex container --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- この中にflex itemを入れる --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex; <span class="hljs-comment">/* これでflex containerになる！ */</span>
}
</code></pre>
<ul>
<li><strong>役割</strong>：子要素（flex item）を並べる「箱」</li>
<li><strong>設定</strong>：<code>display: flex;</code> を指定する</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="flex-item%E5%AD%90%E8%A6%81%E7%B4%A0">Flex Item（子要素）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これがflex item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これもflex item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これもflex item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<ul>
<li><strong>役割</strong>：並べられる「要素」</li>
<li><strong>自動的に</strong>：親が <code>display: flex;</code> になると、その直下の子要素が flex item になる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%9C%80%E3%82%82%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB%E3%81%AA-flexbox">最もシンプルな Flexbox</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>;
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#f0f0f0</span>;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">20px</span>;
}

<span class="hljs-selector-class">.item</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#3b82f6</span>;
  <span class="hljs-attribute">color</span>: white;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>アイテム3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
<p><strong>結果</strong>：3 つのアイテムが<strong>横並び</strong>になる！<img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f389.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="gap---%E8%A6%81%E7%B4%A0%E9%96%93%E3%81%AE%E4%BD%99%E7%99%BD">gap - 要素間の余白</h2>
<p><code>gap</code> プロパティを使うと、flex item 間の余白を簡単に設定できる</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>; <span class="hljs-comment">/* 要素間の余白を20pxに */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="flex-direction---%E4%B8%A6%E3%81%B9%E3%82%8B%E6%96%B9%E5%90%91%E3%82%92%E5%A4%89%E3%81%88%E3%82%8B">flex-direction - 並べる方向を変える</h2>
<h3 id="flex-direction-row%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88"><code>flex-direction: row</code>（デフォルト）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: row; <span class="hljs-comment">/* 横並び（左→右） */</span>
}
</code></pre>
<h3 id="flex-direction-column"><code>flex-direction: column</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: column; <span class="hljs-comment">/* 縦並び（上→下） */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E4%B8%BB%E8%BB%B8%E3%81%A8%E4%BA%A4%E5%B7%AE%E8%BB%B8---flexbox-%E3%81%AE%E9%87%8D%E8%A6%81%E3%81%AA%E6%A6%82%E5%BF%B5">主軸と交差軸 - Flexbox の重要な概念</h2>
<div class="flex">
<div class="flex-1">
<h3 id="%E4%B8%BB%E8%BB%B8main-axis">主軸（Main Axis）</h3>
<ul>
<li><strong>定義</strong>：flex item が並ぶ方向の軸</li>
<li><strong>デフォルト</strong>：横方向（左 → 右）</li>
</ul>
<h3 id="%E4%BA%A4%E5%B7%AE%E8%BB%B8cross-axis">交差軸（Cross Axis）</h3>
<ul>
<li><strong>定義</strong>：主軸に垂直な軸</li>
<li><strong>デフォルト</strong>：縦方向（上 → 下）</li>
</ul>
<p><strong>なぜ軸が重要？</strong></p>
<p><code>justify-content</code>：<strong>主軸方向</strong>の配置を制御<br />
<code>align-items</code>：<strong>交差軸方向</strong>の配置を制御</p>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">【flex-direction: row（デフォルト）】
 主軸 <img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/>（横）
┌───────┬───────┬───────┐
│Item 1 │Item 2 │Item 3 │
└───────┴───────┴───────┘
  交
  差
  軸
  <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>（縦）

【flex-direction: column】
交差軸 <img class="emoji" draggable="false" alt="➡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/27a1.svg" data-marp-twemoji=""/>（横）
┌───────┐
│Item 1 │
├───────┤
│Item 2 │
├───────┤
│Item 3 │
└───────┘
  主

  <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>（縦）
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="justify-content---%E4%B8%BB%E8%BB%B8%E6%96%B9%E5%90%91%E3%81%AE%E9%85%8D%E7%BD%AE">justify-content - 主軸方向の配置</h2>
<p><code>justify-content</code> で、<strong>主軸方向</strong>（デフォルトは横方向）の配置を制御できるよ！</p>
<h4 id="%E4%B8%BB%E8%A6%81%E3%81%AA%E5%80%A4">主要な値</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-attribute">justify-content</span>: flex-start;    <span class="hljs-comment">/* 左寄せ（デフォルト） */</span>
<span class="hljs-attribute">justify-content</span>: center;        <span class="hljs-comment">/* 中央揃え */</span>
<span class="hljs-attribute">justify-content</span>: flex-end;      <span class="hljs-comment">/* 右寄せ */</span>
<span class="hljs-attribute">justify-content</span>: space-between; <span class="hljs-comment">/* 両端に配置、間隔を均等に */</span>
<span class="hljs-attribute">justify-content</span>: space-around;  <span class="hljs-comment">/* 各要素の周りに均等な余白 */</span>
<span class="hljs-attribute">justify-content</span>: space-evenly;  <span class="hljs-comment">/* 全ての余白が均等 */</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-flex-start%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88"><code>justify-content: flex-start</code>（デフォルト）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: flex-start; <span class="hljs-comment">/* 左寄せ */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────┐
│┌───────┬───────┬───────┐                      │
││Item 1 │Item 2 │Item 3 │                      │
│└───────┴───────┴───────┘                      │
│                                               │
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-flex-end"><code>justify-content: flex-end</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: flex-end; <span class="hljs-comment">/* 右寄せ */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────┐
│                      ┌───────┬───────┬───────┐│
│                      │Item 1 │Item 2 │Item 3 ││
│                      └───────┴───────┴───────┘│
│                                               │
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-center"><code>justify-content: center</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: center; <span class="hljs-comment">/* 中央揃え */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────┐
│           ┌───────┬───────┬───────┐           │
│           │Item 1 │Item 2 │Item 3 │           │
│           └───────┴───────┴───────┘           │
│                                               │
</code></pre>
<p><strong>超便利！</strong> 要素を中央に配置するのが、こんなに簡単！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-space-between"><code>justify-content: space-between</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: space-between; <span class="hljs-comment">/* 両端に配置、間隔を均等に */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────────┐
│┌───────┐            ┌───────┐            ┌───────┐│
││Item 1 │            │Item 2 │            │Item 3 ││
│└───────┘            └───────┘            └───────┘│
│                                                   │
</code></pre>
<p><strong>特徴</strong>：</p>
<ul>
<li>最初の要素は左端</li>
<li>最後の要素は右端</li>
<li>間隔が均等</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-space-around"><code>justify-content: space-around</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: space-around; <span class="hljs-comment">/* 各要素の周りに均等な余白 */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────────┐
│    ┌───────┐        ┌───────┐        ┌───────┐    │
│    │Item 1 │        │Item 2 │        │Item 3 │    │
│    └───────┘        └───────┘        └───────┘    │
│                                                   │
</code></pre>
<p><strong>特徴</strong>：</p>
<ul>
<li>各要素の左右に同じサイズの余白</li>
<li>端の余白は要素間の余白の半分</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="justify-content-space-evenly"><code>justify-content: space-evenly</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: space-evenly; <span class="hljs-comment">/* 全ての余白が均等 */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────────────────────────────────┐
│      ┌───────┐      ┌───────┐      ┌───────┐      │
│      │Item 1 │      │Item 2 │      │Item 3 │      │
│      └───────┘      └───────┘      └───────┘      │
│                                                   │
</code></pre>
<p><strong>特徴</strong>：</p>
<ul>
<li>端の余白も要素間の余白も同じ</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="align-items---%E4%BA%A4%E5%B7%AE%E8%BB%B8%E6%96%B9%E5%90%91%E3%81%AE%E9%85%8D%E7%BD%AE">align-items - 交差軸方向の配置</h2>
<p><code>align-items</code> で、<strong>交差軸方向</strong>の配置を制御できる</p>
<h4 id="%E4%B8%BB%E8%A6%81%E3%81%AA%E5%80%A4-1">主要な値</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-attribute">align-items</span>: stretch;    <span class="hljs-comment">/* 高さを揃える（デフォルト） */</span>
<span class="hljs-attribute">align-items</span>: flex-start; <span class="hljs-comment">/* 上揃え */</span>
<span class="hljs-attribute">align-items</span>: flex-end;   <span class="hljs-comment">/* 下揃え */</span>
<span class="hljs-attribute">align-items</span>: center;     <span class="hljs-comment">/* 縦方向の中央揃え */</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="align-items-stretch%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88"><code>align-items: stretch</code>（デフォルト）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">align-items</span>: stretch; <span class="hljs-comment">/* 高さを揃える */</span>
  <span class="hljs-attribute">height</span>: <span class="hljs-number">300px</span>;
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────┬───────┬───────┐
│       │       │       │
│Item 1 │Item 2 │Item 3 │
│       │       │       │
└───────┴───────┴───────┘
</code></pre>
<p><strong>特徴</strong>：全ての flex item が container の高さいっぱいに伸びる</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="align-items-flex-start"><code>align-items: flex-start</code></h3>

  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">align-items</span>: flex-start; <span class="hljs-comment">/* 上揃え */</span>
  <span class="hljs-attribute">height</span>: <span class="hljs-number">300px</span>;
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────┬───────┬───────┐
│Item 1 │Item 2 │Item 3 │
├───────┴───────┴───────┤
│                       │
│                       │
└───────────────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="align-items-flex-end"><code>align-items: flex-end</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">align-items</span>: flex-end; <span class="hljs-comment">/* 下揃え */</span>
  <span class="hljs-attribute">height</span>: <span class="hljs-number">300px</span>;
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────────────────┐
│                       │
│                       │
├───────┬───────┬───────┤
│Item 1 │Item 2 │Item 3 │
└───────┴───────┴───────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="align-items-center"><code>align-items: center</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">align-items</span>: center; <span class="hljs-comment">/* 縦方向の中央揃え */</span>

}
</code></pre>
<p><strong>結果</strong>：</p>

│                       │
├───────┬───────┬───────┤

├───────┴───────┴───────┤
│                       │
└───────────────────────┘
</code></pre>
<p><strong>超便利！</strong> 縦方向の中央揃えも簡単！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%8C%E5%85%A8%E3%81%AA%E4%B8%AD%E5%A4%AE%E9%85%8D%E7%BD%AE">完全な中央配置</h2>
<p><code>justify-content</code> と <code>align-items</code> を組み合わせると、<strong>完全な中央配置</strong>が超簡単！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
