  <span class="hljs-attribute">height</span>: <span class="hljs-number">300px</span>;
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌──────────────────┐
│                  │
│                  │
│     ┌──────┐     │
│     │ Item │     │
│     └──────┘     │
│                  │
│                  │
└──────────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%83%8A%E3%83%93%E3%82%B2%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%83%A1%E3%83%8B%E3%83%A5%E3%83%BC">実践例：ナビゲーションメニュー</h2>
<p>Flexbox の定番の使い方！横並びのナビゲーションメニューを作ろう。</p>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">nav</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">justify-content</span>: space-between;
  <span class="hljs-attribute">align-items</span>: center;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">1rem</span> <span class="hljs-number">2rem</span>;
}
<span class="hljs-selector-class">.logo</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">1.5rem</span>;
  <span class="hljs-attribute">font-weight</span>: bold;
}
<span class="hljs-selector-class">.nav-links</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">2rem</span>;
  <span class="hljs-attribute">list-style</span>: none;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;logo&quot;</span>&gt;</span>MyWebsite<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ul</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav-links&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>ホーム<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>サービス<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>会社概要<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>お問い合わせ<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>
</code></pre>
</div>
</div>
<ul>
<li><code>justify-content: space-between</code>：ロゴとメニューを両端に配置</li>
<li><code>gap: 2rem</code>：メニュー項目の間隔を均等に</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-2-flexbox-%E3%81%BE%E3%81%A8%E3%82%81">Lesson 2: Flexbox まとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>Flexbox は 1 次元レイアウトシステム</strong></li>
<li><strong><code>display: flex;</code> で flex container になる</strong></li>
<li><strong><code>gap</code> で要素間の余白を設定</strong></li>
<li><strong><code>flex-direction</code> で並べる方向を変更</strong></li>
<li><strong>主軸と交差軸の概念</strong></li>
<li><strong><code>justify-content</code> で主軸方向の配置を制御</strong></li>
<li><strong><code>align-items</code> で交差軸方向の配置を制御</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-3">Lesson 3</h1>
<h1 id="grid---%E5%BC%B7%E5%8A%9B%E3%81%AA-2-%E6%AC%A1%E5%85%83%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88-%F0%9F%8E%81">Grid - 強力な 2 次元レイアウト <img class="emoji" draggable="false" alt="🎁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f381.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-3-grid---%E5%BC%B7%E5%8A%9B%E3%81%AA-2-%E6%AC%A1%E5%85%83%E3%83%AC%E3%82%A4%E3%82%A2%E3%82%A6%E3%83%88-%F0%9F%8E%81-1">Lesson 3: Grid - 強力な 2 次元レイアウト <img class="emoji" draggable="false" alt="🎁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f381.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：CSS Grid を使って、複雑な 2 次元レイアウトを簡単に作れるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-grid-%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ Grid を学ぶの？</h3>
<p>Lesson 2 で学んだ Flexbox は、<strong>1 次元</strong>のレイアウトシステムだったよね。</p>
<p>でも、こんなレイアウトを作りたい時はどうする？</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────┬─────┬─────┐
│           │  2  │  3  │
│     1     ├─────┼─────┤
│           │  4  │  5  │
├─────┬─────┼─────┼─────┤
│  6  │  7  │  8  │  9  │
└─────┴─────┴─────┴─────┘
</code></pre>
<p><strong>縦と横の両方を同時に制御したい！</strong> そんな時に Grid が大活躍！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-%E3%81%AE%E5%9F%BA%E6%9C%AC%E6%A6%82%E5%BF%B5">Grid の基本概念</h2>
<h3 id="grid-%E3%81%A8%E3%81%AF">Grid とは？</h3>
<p><strong>CSS Grid（グリッドレイアウト）</strong> は、<strong>2 次元</strong>のレイアウトシステムだよ。</p>
<p><strong>「2 次元」ってどういうこと？</strong></p>
<ul>
<li><strong>横方向（列）と縦方向（行）を同時に</strong>制御できる</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">【2次元レイアウト = Grid】
□ □ □
□ □ □
□ □ □
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-container-%E3%81%A8-grid-item">Grid Container と Grid Item</h2>
<h3 id="grid-container%E8%A6%AA%E8%A6%81%E7%B4%A0">Grid Container（親要素）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- これがgrid container --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-container&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- この中にgrid itemを入れる --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">display</span>: grid; <span class="hljs-comment">/* これでgrid containerになる！ */</span>
}
</code></pre>
<ul>
<li><strong>役割</strong>：子要素（grid item）を配置する「方眼紙」</li>
<li><strong>設定</strong>：<code>display: grid;</code> を指定する</li>
</ul>
<p><strong>例え話</strong>：碁盤（マス目に石を配置する）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h3 id="grid-item%E5%AD%90%E8%A6%81%E7%B4%A0">Grid Item（子要素）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-container&quot;</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これがgrid item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>アイテム1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これもgrid item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>アイテム2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- これもgrid item --&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>アイテム3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<ul>
<li><strong>役割</strong>：配置される「要素」</li>
<li><strong>自動的に</strong>：親が <code>display: grid;</code> になると、その直下の子要素が grid item になる</li>
<li><strong>例え話</strong>：碁盤の上に置く碁石</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%9C%80%E3%82%82%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB%E3%81%AA-grid">最もシンプルな Grid</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">display</span>: grid; <span class="hljs-comment">/* Gridを有効化 */</span>
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>;
}
<span class="hljs-selector-class">.grid-item</span> {
  <span class="hljs-attribute">border</span>: solid <span class="hljs-number">1px</span> <span class="hljs-number">#3b82f6</span>;
  <span class="hljs-attribute">text-align</span>: center;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-container&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>1<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>2<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>3<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>4<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>5<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;grid-item&quot;</span>&gt;</span>6<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
<p><strong>結果</strong>：6 つのアイテムが<strong>3 列 × 2 行</strong>の格子状に配置される！<img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f389.svg" data-marp-twemoji=""/></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────┬───────┬───────┐
│   1   │   2   │   3   │
├───────┼───────┼───────┤
│   4   │   5   │   6   │
└───────┴───────┴───────┘
</code></pre>
<p><strong>たったこれだけ！</strong> 方眼紙のようなレイアウトが簡単に作れる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="gap---%E3%83%9E%E3%82%B9%E7%9B%AE%E3%81%AE%E4%BD%99%E7%99%BD">gap - マス目の余白</h2>
<p><code>gap</code> プロパティで、grid item 間の余白を設定できるよ！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">display</span>: grid;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr;
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">20px</span>; <span class="hljs-comment">/* 行と列の両方に20pxの余白 */</span>
}
</code></pre>
<h3 id="%E8%A1%8C%E3%81%A8%E5%88%97%E3%81%A7%E7%95%B0%E3%81%AA%E3%82%8B%E4%BD%99%E7%99%BD">行と列で異なる余白</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">row-gap</span>: <span class="hljs-number">30px</span>; <span class="hljs-comment">/* 行の余白 */</span>
  <span class="hljs-attribute">column-gap</span>: <span class="hljs-number">10px</span>; <span class="hljs-comment">/* 列の余白 */</span>
  <span class="hljs-comment">/* または */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">30px</span> <span class="hljs-number">10px</span>; <span class="hljs-comment">/* 行 列 の順 */</span>
}
</code></pre>
<p><strong>超簡単！</strong> Flexbox と同じように、<code>gap</code> で余白を設定できる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-template-columns---%E5%88%97%E3%81%AE%E8%A8%AD%E5%AE%9A">grid-template-columns - 列の設定</h2>
<p><code>grid-template-columns</code> で、列の数と幅を設定できるよ！</p>
<h3 id="%E7%AD%89%E5%B9%85%E3%81%AE%E5%88%97fr-%E5%8D%98%E4%BD%8D">等幅の列（fr 単位）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr; <span class="hljs-comment">/* 3列、等幅 */</span>
}
</code></pre>
<p><strong><code>fr</code> とは？</strong></p>
<ul>
<li><strong>fraction（分数）</strong> の略</li>
<li><strong>利用可能な空間を分割</strong>する単位</li>
<li><code>1fr 1fr 1fr</code> = 3 等分</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-template-columns---%E7%95%B0%E3%81%AA%E3%82%8B%E5%B9%85%E3%81%AE%E5%88%97">grid-template-columns - 異なる幅の列</h2>
<h3 id="%E7%95%B0%E3%81%AA%E3%82%8B%E5%B9%85%E3%81%AE%E5%88%97">異なる幅の列</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">2</span>fr <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr; <span class="hljs-comment">/* 最初の列だけ2倍の幅 */</span>
}
</code></pre>
<h3 id="%E5%9B%BA%E5%AE%9A%E5%B9%85%E3%81%A8%E3%83%95%E3%83%AC%E3%82%AD%E3%82%B7%E3%83%96%E3%83%AB%E5%B9%85%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B">固定幅とフレキシブル幅の組み合わせ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">200px</span> <span class="hljs-number">1</span>fr <span class="hljs-number">1</span>fr; <span class="hljs-comment">/* 最初の列は固定200px */</span>
}
</code></pre>
<p><strong>固定幅とフレキシブル幅を組み合わせる</strong>のが Grid の強み！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="repeat-%E9%96%A2%E6%95%B0%E3%81%A7%E7%B0%A1%E6%BD%94%E3%81%AB">repeat() 関数で簡潔に</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>fr); <span class="hljs-comment">/* 1fr 1fr 1fr と同じ */</span>
}
</code></pre>
<p><strong>超便利！</strong> 同じパターンを繰り返す時に使える！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 4列の等幅 */</span>
<span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">4</span>, <span class="hljs-number">1</span>fr);

<span class="hljs-comment">/* 3列、最初だけ200px、残りは等幅 */</span>
<span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">200px</span> <span class="hljs-built_in">repeat</span>(<span class="hljs-number">2</span>, <span class="hljs-number">1</span>fr);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="auto-fit-%E3%81%A8-minmax-%E3%81%A7%E7%A9%B6%E6%A5%B5%E3%81%AE%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96">auto-fit と minmax() で究極のレスポンシブ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(auto-fit, <span class="hljs-built_in">minmax</span>(<span class="hljs-number">200px</span>, <span class="hljs-number">1</span>fr));
  <span class="hljs-comment">/* 最小200px、画面幅に応じて列数が自動調整！ */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<ul>
<li><strong>広い画面</strong>：200px 以上の列が横に並ぶ</li>
<li><strong>狭い画面</strong>：列数が自動で減る（レスポンシブ！）</li>
</ul>
<p><strong>これが Grid の魔法！</strong> メディアクエリなしでレスポンシブ！<img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-template-rows---%E8%A1%8C%E3%81%AE%E8%A8%AD%E5%AE%9A">grid-template-rows - 行の設定</h2>
<p><code>grid-template-rows</code> で、行の高さを設定できるよ！</p>
<h3 id="%E5%9B%BA%E5%AE%9A%E3%81%AE%E8%A1%8C%E3%81%AE%E9%AB%98%E3%81%95">固定の行の高さ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">3</span>, <span class="hljs-number">1</span>fr);
  <span class="hljs-attribute">grid-template-rows</span>: <span class="hljs-number">100px</span> <span class="hljs-number">200px</span>; <span class="hljs-comment">/* 1行目は100px、2行目は200px */</span>
}
</code></pre>
<h3 id="auto-%E3%81%A7%E8%87%AA%E5%8B%95%E8%AA%BF%E6%95%B4">auto で自動調整</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.grid-container</span> {
  <span class="hljs-attribute">grid-template-rows</span>: auto auto; <span class="hljs-comment">/* 内容に応じて高さが決まる */</span>
}
</code></pre>
<p><strong><code>auto</code></strong>：内容の量に応じて自動で高さが決まる（便利！）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-column-%E3%81%A8-grid-row---%E8%A6%81%E7%B4%A0%E3%81%AE%E9%85%8D%E7%BD%AE">grid-column と grid-row - 要素の配置</h2>
<p>Grid の真骨頂！特定の grid item を<strong>複数のセルにまたがって配置</strong>できるよ！</p>
<h3 id="%E5%88%97%E3%82%92%E3%81%BE%E3%81%9F%E3%81%90grid-column">列をまたぐ（grid-column）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.item1</span> {
  <span class="hljs-attribute">grid-column</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-comment">/* 1列目から3列目の手前まで（2列分） */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────┬─────┐
│     1     │  2  │
├─────┬─────┼─────┤
│  3  │  4  │  5  │
└─────┴─────┴─────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-column-%E3%81%A8-grid-row---%E8%A6%81%E7%B4%A0%E3%81%AE%E9%85%8D%E7%BD%AE%E7%B6%9A%E3%81%8D">grid-column と grid-row - 要素の配置（続き）</h2>
<h3 id="%E8%A1%8C%E3%82%92%E3%81%BE%E3%81%9F%E3%81%90grid-row">行をまたぐ（grid-row）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.item1</span> {
  <span class="hljs-attribute">grid-row</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-comment">/* 1行目から3行目の手前まで（2行分） */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌─────┬─────┬─────┐
│     │  2  │  3  │
│  1  ├─────┼─────┤
│     │  4  │  5  │
└─────┴─────┴─────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-column-%E3%81%A8-grid-row---%E8%A6%81%E7%B4%A0%E3%81%AE%E9%85%8D%E7%BD%AE%E7%B6%9A%E3%81%8D-1">grid-column と grid-row - 要素の配置（続き）</h2>
<h3 id="%E8%A1%8C%E3%81%A8%E5%88%97%E3%81%AE%E4%B8%A1%E6%96%B9%E3%82%92%E3%81%BE%E3%81%9F%E3%81%90">行と列の両方をまたぐ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.item1</span> {
  <span class="hljs-attribute">grid-column</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-comment">/* 2列分 */</span>
  <span class="hljs-attribute">grid-row</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-comment">/* 2行分 */</span>
}
</code></pre>
<p><strong>結果</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌───────────┬─────┐
│           │  2  │
│     1     ├─────┤
│           │  3  │
├─────┬─────┼─────┤
│  4  │  5  │  6  │
└─────┴─────┴─────┘
</code></pre>
<p><strong>大きなアイテムを作るのも簡単！</strong> ダッシュボードやギャラリーに最適！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="grid-column-%E3%81%A8-grid-row---%E8%A6%81%E7%B4%A0%E3%81%AE%E9%85%8D%E7%BD%AE%E7%B6%9A%E3%81%8D-2">grid-column と grid-row - 要素の配置（続き）</h2>
<h3 id="span-%E3%81%A7%E6%8C%87%E5%AE%9A%E3%81%99%E3%82%8B%E3%82%88%E3%82%8A%E7%9B%B4%E6%84%9F%E7%9A%84">span で指定する（より直感的）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.item1</span> {
  <span class="hljs-attribute">grid-column</span>: span <span class="hljs-number">2</span>; <span class="hljs-comment">/* 2列分を占有 */</span>
  <span class="hljs-attribute">grid-row</span>: span <span class="hljs-number">2</span>; <span class="hljs-comment">/* 2行分を占有 */</span>
}
</code></pre>
<p><strong><code>span</code></strong>：「何列/行分を占有するか」を直接指定（わかりやすい！）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 同じ結果 */</span>
<span class="hljs-attribute">grid-column</span>: <span class="hljs-number">1</span> / <span class="hljs-number">3</span>; <span class="hljs-comment">/* 1列目から3列目の手前まで */</span>
<span class="hljs-attribute">grid-column</span>: span <span class="hljs-number">2</span>; <span class="hljs-comment">/* 2列分 */</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-3-grid-%E3%81%BE%E3%81%A8%E3%82%81">Lesson 3: Grid まとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>Grid は 2 次元レイアウトシステム</strong></li>
<li><strong><code>display: grid;</code> で grid container になる</strong></li>
<li><strong><code>gap</code> で要素間の余白を設定</strong></li>
<li><strong><code>grid-template-columns</code> で列の数と幅を設定</strong></li>
<li><strong><code>repeat()</code>, <code>auto-fit</code>, <code>minmax()</code> でレスポンシブなレイアウト</strong></li>
<li><strong><code>grid-template-rows</code> で行の高さを設定</strong></li>
<li><strong><code>grid-column</code> / <code>grid-row</code> で要素を複数のセルにまたがせる</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="flexbox-vs-grid---%E3%81%A9%E3%81%A3%E3%81%A1%E3%82%92%E4%BD%BF%E3%81%86">Flexbox vs Grid - どっちを使う？</h2>
<p><strong>迷った時の選び方</strong>：</p>
<h3 id="flexbox-%E3%82%92%E4%BD%BF%E3%81%86%E5%A0%B4%E5%90%88">Flexbox を使う場合</h3>
<ul>
<li><strong>1 次元</strong>のレイアウト（横並び or 縦並び）</li>
<li>ナビゲーションメニュー</li>
<li>ボタンの配置</li>
<li>小さなコンポーネント</li>
</ul>
<h3 id="grid-%E3%82%92%E4%BD%BF%E3%81%86%E5%A0%B4%E5%90%88">Grid を使う場合</h3>
<ul>
<li><strong>2 次元</strong>のレイアウト（行と列の両方）</li>
<li>ページ全体のレイアウト</li>
<li>画像ギャラリー、カードグリッド</li>
<li>ダッシュボード</li>
</ul>
<p><strong>Grid と Flexbox は競合しない！</strong> むしろ、組み合わせると最強！<img class="emoji" draggable="false" alt="💪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4aa.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-4">Lesson 4</h1>
<h1 id="%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3-%F0%9F%93%B1">レスポンシブデザイン <img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-4-%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3-%F0%9F%93%B1-1">Lesson 4: レスポンシブデザイン <img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：様々なデバイスで美しく表示されるレスポンシブなウェブサイトを作れるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜレスポンシブデザインを学ぶの？</h3>
<p>現代のウェブサイトは、<strong>様々なデバイス</strong>で閲覧されるよね：</p>
<ul>
<li><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/> スマートフォン（375px ~ 428px）</li>
<li><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/> タブレット（768px ~ 1024px）</li>
<li><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4bb.svg" data-marp-twemoji=""/> ノートパソコン（1366px ~ 1920px）</li>
<li><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f5a5.svg" data-marp-twemoji=""/> デスクトップ（1920px ~）</li>
</ul>
<p><strong>1 つのデザインで、全てのデバイスに対応する！</strong> それがレスポンシブデザイン！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3%E3%81%AE%E5%9F%BA%E6%9C%AC%E6%A6%82%E5%BF%B5">レスポンシブデザインの基本概念</h2>
<ul>
<li>Viewport（ビューポート）</li>
<li>Media Queries（メディアクエリ）</li>
<li>Breakpoint（ブレークポイント）</li>
<li>Mobile First（モバイルファースト）</li>
<li>Fluid Units（可変単位）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="viewport%E3%83%93%E3%83%A5%E3%83%BC%E3%83%9D%E3%83%BC%E3%83%88">Viewport（ビューポート）</h2>
<p><strong>viewport</strong> = ブラウザの表示領域のサイズ</p>
<h4 id="viewport-meta-%E3%82%BF%E3%82%B0">viewport meta タグ</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;viewport&quot;</span> <span class="hljs-attr">content</span>=<span class="hljs-string">&quot;width=device-width, initial-scale=1.0&quot;</span>&gt;</span>
</code></pre>
<p><strong>これがないと、スマホで見た時に PC 版が縮小表示される！</strong></p>
<p><strong>必須！</strong> すべての HTML ファイルの <code>&lt;head&gt;</code> に入れよう！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2%E3%82%AF%E3%82%A8%E3%83%AAmedia-queries">メディアクエリ（Media Queries）</h2>
<p><strong>メディアクエリ</strong> = デバイスの特性（画面幅など）に応じて、CSS を切り替える仕組み</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* PC向けのスタイル */</span>
<span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">1200px</span>;
}

<span class="hljs-comment">/* スマホ向けのスタイル */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">768px</span>) {
  <span class="hljs-selector-class">.container</span> {
    <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
  }
}
</code></pre>
<p><strong>画面幅が 768px 以下の時だけ、<code>width: 100%;</code> が適用される！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%96%E3%83%AC%E3%83%BC%E3%82%AF%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88breakpoint">ブレークポイント（Breakpoint）</h2>
<p><strong>ブレークポイント</strong> = デザインが切り替わる画面幅</p>
<p>一般的なブレークポイント：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* スマホ（縦向き） */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">480px</span>) {
}

<span class="hljs-comment">/* スマホ（横向き）・小型タブレット */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">768px</span>) {
}

<span class="hljs-comment">/* タブレット */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">max-width</span>: <span class="hljs-number">1024px</span>) {
}

<span class="hljs-comment">/* PC */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">1025px</span>) {
}
</code></pre>
<p><strong>重要！</strong> これは一般的な目安。実際のプロジェクトでは、コンテンツに応じて調整しよう！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%A2%E3%83%90%E3%82%A4%E3%83%AB%E3%83%95%E3%82%A1%E3%83%BC%E3%82%B9%E3%83%88%E3%81%AE%E8%80%83%E3%81%88%E6%96%B9">モバイルファーストの考え方</h2>
<p><strong>モバイルファースト</strong> = スマホのデザインから徐々に画面が大きいデバイスに対応する考え方</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* デフォルトはスマホ向け */</span>
<span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100%</span>;
  <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-number">1</span>fr; <span class="hljs-comment">/* 1列 */</span>
}
<span class="hljs-comment">/* タブレット以上では変更 */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">768px</span>) {
  <span class="hljs-selector-class">.container</span> {
    <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">2</span>, <span class="hljs-number">1</span>fr); <span class="hljs-comment">/* 2列 */</span>
  }
}
<span class="hljs-comment">/* PC では変更 */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">1024px</span>) {
  <span class="hljs-selector-class">.container</span> {
    <span class="hljs-attribute">width</span>: <span class="hljs-number">1200px</span>;
    <span class="hljs-attribute">grid-template-columns</span>: <span class="hljs-built_in">repeat</span>(<span class="hljs-number">4</span>, <span class="hljs-number">1</span>fr); <span class="hljs-comment">/* 4列 */</span>
  }
}
</code></pre>
<p><strong>現代のベストプラクティス</strong> = モバイルファースト！<img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4f1.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%8F%AF%E5%A4%89%E5%8D%98%E4%BD%8Dfluid-units">可変単位（Fluid Units）</h2>
<h3 id="1-%E3%83%91%E3%83%BC%E3%82%BB%E3%83%B3%E3%83%88">1. パーセント（%）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">90%</span>; <span class="hljs-comment">/* 親要素の90% */</span>
  <span class="hljs-attribute">max-width</span>: <span class="hljs-number">1200px</span>; <span class="hljs-comment">/* 最大幅を制限 */</span>
}
</code></pre>
<h3 id="2-vw-%E3%81%A8-vhviewport-width--height">2. vw と vh（Viewport Width / Height）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.hero</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">100vw</span>; <span class="hljs-comment">/* ビューポートの幅の100% */</span>
  <span class="hljs-attribute">height</span>: <span class="hljs-number">100vh</span>; <span class="hljs-comment">/* ビューポートの高さの100% */</span>
}
</code></pre>
<ul>
<li><code>1vw</code> = ビューポート幅の 1%</li>
<li><code>1vh</code> = ビューポート高さの 1%</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%8F%AF%E5%A4%89%E5%8D%98%E4%BD%8Dfluid-units%E7%B6%9A%E3%81%8D">可変単位（Fluid Units）続き</h2>
<h3 id="3-rem-%E3%81%A8-em">3. rem と em</h3>
<h4 id="remroot-em">rem（Root EM）</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-tag">html</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">16px</span>; <span class="hljs-comment">/* ルート要素のフォントサイズ */</span>
}
<span class="hljs-selector-class">.text</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">1rem</span>; <span class="hljs-comment">/* = 16px */</span>
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">2rem</span>; <span class="hljs-comment">/* = 32px */</span>
}
</code></pre>
<ul>
<li><code>1rem</code> = ルート要素（<code>&lt;html&gt;</code>）のフォントサイズ</li>
</ul>
<h3 id="4-calc---%E8%A8%88%E7%AE%97%E3%81%A7%E5%80%A4%E3%82%92%E6%8C%87%E5%AE%9A">4. calc() - 計算で値を指定</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.container</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-built_in">calc</span>(<span class="hljs-number">100%</span> - <span class="hljs-number">40px</span>); <span class="hljs-comment">/* 幅100%から40pxを引く */</span>
  <span class="hljs-attribute">height</span>: <span class="hljs-built_in">calc</span>(<span class="hljs-number">100vh</span> - <span class="hljs-number">80px</span>); <span class="hljs-comment">/* 画面の高さからヘッダー分を引く */</span>
}
</code></pre>
<p><strong>超便利！</strong> 異なる単位を組み合わせて計算できる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%8A%E3%83%93%E3%82%B2%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3">実践例：レスポンシブナビゲーション</h2>
<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* モバイルファースト */</span>
<span class="hljs-selector-tag">nav</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#1f2937</span>;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">1rem</span>;
}

<span class="hljs-selector-class">.nav-container</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: column; <span class="hljs-comment">/* スマホでは縦並び */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">1rem</span>;
}

<span class="hljs-selector-class">.logo</span> {
  <span class="hljs-attribute">color</span>: white;
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">1.5rem</span>;
  <span class="hljs-attribute">font-weight</span>: bold;
  <span class="hljs-attribute">text-align</span>: center;
}

<span class="hljs-selector-class">.nav-links</span> {
  <span class="hljs-attribute">display</span>: flex;
  <span class="hljs-attribute">flex-direction</span>: column; <span class="hljs-comment">/* スマホでは縦並び */</span>
  <span class="hljs-attribute">gap</span>: <span class="hljs-number">0.5rem</span>;
  <span class="hljs-attribute">list-style</span>: none;
  <span class="hljs-attribute">margin</span>: <span class="hljs-number">0</span>;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">0</span>;
}

<span class="hljs-selector-class">.nav-links</span> <span class="hljs-selector-tag">a</span> {
  <span class="hljs-attribute">color</span>: white;
  <span class="hljs-attribute">text-decoration</span>: none;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">0.5rem</span>;
  <span class="hljs-attribute">text-align</span>: center;
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">4px</span>;
  <span class="hljs-attribute">transition</span>: background-color <span class="hljs-number">0.3s</span>;
}

<span class="hljs-selector-class">.nav-links</span> <span class="hljs-selector-tag">a</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#374151</span>;
}

<span class="hljs-comment">/* タブレット以上では横並び */</span>
<span class="hljs-keyword">@media</span> (<span class="hljs-attribute">min-width</span>: <span class="hljs-number">768px</span>) {
  <span class="hljs-selector-class">.nav-container</span> {
    <span class="hljs-attribute">flex-direction</span>: row; <span class="hljs-comment">/* 横並び */</span>
    <span class="hljs-attribute">justify-content</span>: space-between;
    <span class="hljs-attribute">align-items</span>: center;
  }

  <span class="hljs-selector-class">.nav-links</span> {
    <span class="hljs-attribute">flex-direction</span>: row; <span class="hljs-comment">/* 横並び */</span>
    <span class="hljs-attribute">gap</span>: <span class="hljs-number">2rem</span>;
  }

  <span class="hljs-selector-class">.logo</span> {
    <span class="hljs-attribute">text-align</span>: left;
  }

  <span class="hljs-selector-class">.nav-links</span> <span class="hljs-selector-tag">a</span> {
    <span class="hljs-attribute">text-align</span>: left;
  }
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%8A%E3%83%93%E3%82%B2%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E7%B6%9A%E3%81%8D">実践例：レスポンシブナビゲーション（続き）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">nav</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav-container&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;logo&quot;</span>&gt;</span>MyWebsite<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">ul</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;nav-links&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>ホーム<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>サービス<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>会社概要<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">a</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;#&quot;</span>&gt;</span>お問い合わせ<span class="hljs-tag">&lt;/<span class="hljs-name">a</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">nav</span>&gt;</span>
</code></pre>
<p><strong>ポイント</strong>：</p>
<ul>
<li>スマホでは縦並び、PC では横並び</li>
<li>メディアクエリで <code>flex-direction</code> を切り替える</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-4-%E3%83%AC%E3%82%B9%E3%83%9D%E3%83%B3%E3%82%B7%E3%83%96%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3%E3%81%BE%E3%81%A8%E3%82%81">Lesson 4: レスポンシブデザインまとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>レスポンシブデザインの重要性</strong></li>
<li><strong>viewport メタタグの必要性</strong></li>
<li><strong>メディアクエリの基本</strong></li>
<li><strong>ブレークポイントの設定</strong></li>
<li><strong>モバイルファーストの考え方</strong></li>
<li><strong>可変単位</strong>（%, vw, vh, rem, em, calc()）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-5">Lesson 5</h1>
<h1 id="css-%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3-%E2%9C%A8">CSS アニメーション <img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-5-css-%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3-%E2%9C%A8-1">Lesson 5: CSS アニメーション <img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：CSS でアニメーションを作成し、ウェブサイトをインタラクティブで魅力的にできるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-css-%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ CSS アニメーションを学ぶの？</h3>
<p>静的なウェブサイトも良いけど、<strong>動きがあるウェブサイト</strong>はもっと魅力的！</p>
<h3 id="%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%81%AE%E5%8A%B9%E6%9E%9C">アニメーションの効果</h3>
<ul>
<li><strong>ユーザーの注意を引く</strong>（重要な要素を目立たせる）</li>
<li><strong>操作のフィードバック</strong>（ボタンを押した感覚）</li>
<li><strong>スムーズな UX</strong>（画面遷移が自然に感じる）</li>
<li><strong>視覚的な魅力</strong>（ワクワクするデザイン）</li>
</ul>
<p><strong>でも注意！</strong> アニメーションは「演出」。使いすぎると<strong>邪魔</strong>になる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="css-%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%81%AE-2-%E3%81%A4%E3%81%AE%E6%96%B9%E6%B3%95">CSS アニメーションの 2 つの方法</h2>
<p>CSS でアニメーションを作る方法は、主に 2 つあるよ：</p>
<h3 id="1-transition%E3%83%88%E3%83%A9%E3%83%B3%E3%82%B8%E3%82%B7%E3%83%A7%E3%83%B3">1. transition（トランジション）</h3>
<ul>
<li><strong>使い方</strong>：状態変化（ホバー、クリックなど）をスムーズに</li>
<li><strong>特徴</strong>：シンプル、使いやすい</li>
<li><strong>用途</strong>：ホバー効果、色の変化など</li>
</ul>
<h3 id="2-animationkeyframes">2. animation（@keyframes）</h3>
<ul>
<li><strong>使い方</strong>：複雑なアニメーションを定義</li>
<li><strong>特徴</strong>：細かい制御が可能、ループも可能</li>
<li><strong>用途</strong>：ローディングアニメーション、複雑な動きなど</li>
</ul>
<p><strong>まずは transition から学ぼう！</strong> 簡単で、すぐに使える！<img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transition---%E7%8A%B6%E6%85%8B%E5%A4%89%E5%8C%96%E3%82%92%E3%82%B9%E3%83%A0%E3%83%BC%E3%82%BA%E3%81%AB">transition - 状態変化をスムーズに</h2>
<h3 id="%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA%E4%BD%BF%E3%81%84%E6%96%B9">基本的な使い方</h3>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.button</span> {
  <span class="hljs-comment">/* これがtransition！ */</span>
  <span class="hljs-attribute">transition</span>: background-color <span class="hljs-number">0.3s</span>;
  <span class="hljs-attribute">background-color</span>: blue;
  <span class="hljs-attribute">color</span>: white;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">12px</span> <span class="hljs-number">24px</span>;
}
<span class="hljs-selector-class">.button</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-comment">/* ホバー時の色 */</span>
  <span class="hljs-attribute">background-color</span>: green;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;button&quot;</span>&gt;</span>
  ホバーしてみて！
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
</div>
</div>
<p><strong>結果</strong>：ホバーすると、背景色が<strong>0.3 秒かけて</strong>スムーズに変化する！<img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></p>
<p><strong>transition なし</strong>：パッと瞬時に変わる<br />
<strong>transition あり</strong>：ゆっくりスムーズに変わる</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transition-%E3%81%AE-4-%E3%81%A4%E3%81%AE%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3">transition の 4 つのプロパティ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.button</span> {
  <span class="hljs-comment">/* 個別に指定 */</span>
  <span class="hljs-attribute">transition-property</span>: background-color; <span class="hljs-comment">/* 何を変化させるか */</span>
  <span class="hljs-attribute">transition-duration</span>: <span class="hljs-number">0.3s</span>; <span class="hljs-comment">/* 何秒かけて変化させるか */</span>
  <span class="hljs-attribute">transition-timing-function</span>: ease; <span class="hljs-comment">/* どのように変化させるか */</span>
  <span class="hljs-attribute">transition-delay</span>: <span class="hljs-number">0s</span>; <span class="hljs-comment">/* 何秒待ってから開始するか */</span>

  <span class="hljs-comment">/* まとめて指定（ショートハンド） */</span>
  <span class="hljs-attribute">transition</span>: background-color <span class="hljs-number">0.3s</span> ease <span class="hljs-number">0s</span>;
  <span class="hljs-comment">/* または */</span>
  <span class="hljs-attribute">transition</span>: background-color <span class="hljs-number">0.3s</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transition-property---%E4%BD%95%E3%82%92%E5%A4%89%E5%8C%96%E3%81%95%E3%81%9B%E3%82%8B%E3%81%8B">transition-property - 何を変化させるか</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 特定のプロパティだけ */</span>
<span class="hljs-selector-class">.button</span> {
  <span class="hljs-attribute">transition-property</span>: background-color;
}

<span class="hljs-comment">/* 複数のプロパティ */</span>
<span class="hljs-selector-class">.button</span> {
  <span class="hljs-attribute">transition-property</span>: background-color, transform;
}

<span class="hljs-comment">/* 全てのプロパティ */</span>
<span class="hljs-selector-class">.button</span> {
  <span class="hljs-attribute">transition-property</span>: all; <span class="hljs-comment">/* 全部に適用（便利だけど重い） */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E5%8F%AF%E8%83%BD%E3%81%AA%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3">アニメーション可能なプロパティ</h2>
<p><strong>全てのプロパティがアニメーションできるわけではない！</strong></p>
<h3 id="%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E5%8F%AF%E8%83%BD">アニメーション可能</h3>
<ul>
<li><strong>色</strong>：<code>color</code>, <code>background-color</code>, <code>border-color</code></li>
<li><strong>サイズ</strong>：<code>width</code>, <code>height</code>, <code>padding</code>, <code>margin</code></li>
<li><strong>位置</strong>：<code>top</code>, <code>left</code>, <code>right</code>, <code>bottom</code></li>
<li><strong>変形</strong>：<code>transform</code></li>
<li><strong>透明度</strong>：<code>opacity</code></li>
<li><strong>影</strong>：<code>box-shadow</code>, <code>text-shadow</code></li>
</ul>
<h3 id="%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E4%B8%8D%E5%8F%AF">アニメーション不可</h3>
<div class="demerit">
<ul>
<li><strong>表示/非表示</strong>：<code>display</code>（<code>none</code> ⇔ <code>block</code> は瞬時）</li>
<li><strong>配置方法</strong>：<code>position</code>（<code>static</code> ⇔ <code>absolute</code> は瞬時）</li>
<li><strong>フォント</strong>：<code>font-family</code></li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transition-timing-function---%E3%81%A9%E3%81%AE%E3%82%88%E3%81%86%E3%81%AB%E5%A4%89%E5%8C%96%E3%81%95%E3%81%9B%E3%82%8B%E3%81%8B">transition-timing-function - どのように変化させるか</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.ease</span> {
  <span class="hljs-attribute">transition-timing-function</span>: ease; <span class="hljs-comment">/* ゆっくり始まり、ゆっくり終わる */</span>
}
<span class="hljs-selector-class">.linear</span> {
  <span class="hljs-attribute">transition-timing-function</span>: linear; <span class="hljs-comment">/* 一定速度 */</span>
}
<span class="hljs-selector-class">.ease-in</span> {
  <span class="hljs-attribute">transition-timing-function</span>: ease-in; <span class="hljs-comment">/* ゆっくり始まる */</span>
}
<span class="hljs-selector-class">.ease-out</span> {
  <span class="hljs-attribute">transition-timing-function</span>: ease-out; <span class="hljs-comment">/* ゆっくり終わる */</span>
}
<span class="hljs-selector-class">.ease-in-out</span> {
  <span class="hljs-attribute">transition-timing-function</span>: ease-in-out; <span class="hljs-comment">/* ゆっくり始まり、ゆっくり終わる */</span>
}
</code></pre>
<p><strong>おすすめ</strong>：</p>
<ul>
<li><strong>ease</strong>：汎用的（デフォルト）</li>
<li><strong>ease-out</strong>：自然な動き（多くの場面で使える）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transform---%E8%A6%81%E7%B4%A0%E3%82%92%E5%A4%89%E5%BD%A2%E3%81%95%E3%81%9B%E3%82%8B">transform - 要素を変形させる</h2>
<p><code>transform</code> は、要素を移動、回転、拡大縮小できる超強力なプロパティ！</p>
<h3 id="1-translate---%E7%A7%BB%E5%8B%95">1. translate - 移動</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(<span class="hljs-number">100px</span>); <span class="hljs-comment">/* 右に100px移動 */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateY</span>(-<span class="hljs-number">50px</span>); <span class="hljs-comment">/* 上に50px移動 */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translate</span>(<span class="hljs-number">100px</span>, -<span class="hljs-number">50px</span>); <span class="hljs-comment">/* 右に100px、上に50px */</span>
}
</code></pre>
<h3 id="2-scale---%E6%8B%A1%E5%A4%A7%E7%B8%AE%E5%B0%8F">2. scale - 拡大縮小</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">1.5</span>); <span class="hljs-comment">/* 1.5倍に拡大 */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">scale</span>(<span class="hljs-number">0.5</span>); <span class="hljs-comment">/* 0.5倍に縮小 */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="transform%E7%B6%9A%E3%81%8D">transform（続き）</h2>
<h3 id="3-rotate---%E5%9B%9E%E8%BB%A2">3. rotate - 回転</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotate</span>(<span class="hljs-number">45deg</span>); <span class="hljs-comment">/* 45度回転 */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotate</span>(-<span class="hljs-number">90deg</span>); <span class="hljs-comment">/* -90度回転（反時計回り） */</span>
}
</code></pre>
<h3 id="4-%E8%A4%87%E6%95%B0%E3%81%AE-transform-%E3%82%92%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B%E3%82%8B">4. 複数の transform を組み合わせる</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(<span class="hljs-number">100px</span>) <span class="hljs-built_in">rotate</span>(<span class="hljs-number">45deg</span>) <span class="hljs-built_in">scale</span>(<span class="hljs-number">1.5</span>);
  <span class="hljs-comment">/* 右に100px移動、45度回転、1.5倍に拡大 */</span>
}
</code></pre>
<p><strong>重要！</strong> <code>transform</code> は複数のプロパティを 1 つにまとめる！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%83%9B%E3%83%90%E3%83%BC%E5%8A%B9%E6%9E%9C%E3%81%AE%E3%83%9C%E3%82%BF%E3%83%B3">実践例：ホバー効果のボタン</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.button-hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#3b82f6</span>;
  <span class="hljs-attribute">color</span>: white;
  <span class="hljs-attribute">padding</span>: <span class="hljs-number">12px</span> <span class="hljs-number">24px</span>;
  <span class="hljs-attribute">border</span>: none;
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">6px</span>;
  <span class="hljs-attribute">cursor</span>: pointer;
  <span class="hljs-attribute">transition</span>: all <span class="hljs-number">0.3s</span> ease;
}

<span class="hljs-selector-class">.button-hover</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">background-color</span>: <span class="hljs-number">#2563eb</span>;
  <span class="hljs-comment">/* 上に2px移動 */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateY</span>(-<span class="hljs-number">2px</span>); 
  <span class="hljs-comment">/* 影を追加 */</span>
  <span class="hljs-attribute">box-shadow</span>: <span class="hljs-number">0</span> <span class="hljs-number">4px</span> <span class="hljs-number">8px</span> <span class="hljs-built_in">rgba</span>(<span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0.2</span>); 
}

<span class="hljs-selector-class">.button-hover</span><span class="hljs-selector-pseudo">:active</span> {
  <span class="hljs-comment">/* クリック時は元に戻す */</span>
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateY</span>(<span class="hljs-number">0</span>); 
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;button-hover&quot;</span>&gt;</span>
  クリックしてみて！
<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
</div>
</div>
<p><strong>ポイント</strong>：ホバーで少し浮き上がる（<code>translateY(-2px)</code>）</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="keyframes---%E8%A4%87%E9%9B%91%E3%81%AA%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%82%92%E5%AE%9A%E7%BE%A9">@keyframes - 複雑なアニメーションを定義</h2>
<p><code>@keyframes</code> を使うと、より複雑なアニメーションを作れるよ！</p>
<h3 id="%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA%E4%BD%BF%E3%81%84%E6%96%B9-1">基本的な使い方</h3>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* アニメーションを定義 */</span>
<span class="hljs-keyword">@keyframes</span> fadeIn {
  <span class="hljs-selector-tag">from</span> {
    <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0</span>; <span class="hljs-comment">/* 開始時：透明 */</span>
  }
  <span class="hljs-selector-tag">to</span> {
    <span class="hljs-attribute">opacity</span>: <span class="hljs-number">1</span>; <span class="hljs-comment">/* 終了時：不透明 */</span>
  }
}
<span class="hljs-comment">/* アニメーションを適用 */</span>
<span class="hljs-selector-class">.fade-in-box</span> {
  <span class="hljs-attribute">background-color</span>: yellow;
  <span class="hljs-attribute">animation</span>: fadeIn <span class="hljs-number">1s</span> ease;
  <span class="hljs-comment">/* アニメーション名 期間 タイミング関数 */</span>
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;fade-in-box&quot;</span>&gt;</span>
  フェードインする要素
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
<p><strong>結果</strong>：要素が 1 秒かけて、透明から不透明に変化する！<img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2728.svg" data-marp-twemoji=""/></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%91%E3%83%BC%E3%82%BB%E3%83%B3%E3%83%88%E3%81%A7%E7%B4%B0%E3%81%8B%E3%81%8F%E5%88%B6%E5%BE%A1">パーセントで細かく制御</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@keyframes</span> slideInFromLeft {
  <span class="hljs-number">0%</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(-<span class="hljs-number">100%</span>);
    <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0</span>;
  }
  <span class="hljs-number">50%</span> {
    <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0.3</span>;
  }
  <span class="hljs-number">100%</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(<span class="hljs-number">0</span>);
    <span class="hljs-attribute">opacity</span>: <span class="hljs-number">1</span>;
  }
}
<span class="hljs-selector-class">.slide-in</span> {
  <span class="hljs-attribute">background-color</span>: yellow;
  <span class="hljs-attribute">animation</span>: slideInFromLeft <span class="hljs-number">5s</span> ease;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;slide-in&quot;</span>&gt;</span>
  スライドインする要素
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
<ul>
<li><code>0%</code>：アニメーション開始時</li>
<li><code>50%</code>：アニメーション半分</li>
<li><code>100%</code>：アニメーション終了時</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="animation-%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3%E3%81%AE%E8%A9%B3%E7%B4%B0">animation プロパティの詳細</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.box</span> {
  <span class="hljs-comment">/* 個別に指定 */</span>
  <span class="hljs-attribute">animation-name</span>: fadeIn; <span class="hljs-comment">/* アニメーション名 */</span>
  <span class="hljs-attribute">animation-duration</span>: <span class="hljs-number">1s</span>; <span class="hljs-comment">/* 期間 */</span>
  <span class="hljs-attribute">animation-timing-function</span>: ease; <span class="hljs-comment">/* タイミング関数 */</span>
  <span class="hljs-attribute">animation-delay</span>: <span class="hljs-number">0.5s</span>; <span class="hljs-comment">/* 遅延 */</span>
  <span class="hljs-attribute">animation-iteration-count</span>: infinite; <span class="hljs-comment">/* 繰り返し回数（infiniteで無限） */</span>
  <span class="hljs-attribute">animation-direction</span>: alternate; <span class="hljs-comment">/* 方向（alternateで往復） */</span>
  <span class="hljs-attribute">animation-fill-mode</span>: forwards; <span class="hljs-comment">/* 終了後の状態 */</span>

  <span class="hljs-comment">/* まとめて指定（ショートハンド） */</span>
  <span class="hljs-attribute">animation</span>: fadeIn <span class="hljs-number">1s</span> ease <span class="hljs-number">0.5s</span> infinite alternate forwards;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%83%AD%E3%83%BC%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0%E3%82%B9%E3%83%94%E3%83%8A%E3%83%BC">実践例：ローディングスピナー</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-keyword">@keyframes</span> spin {
  <span class="hljs-selector-tag">from</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotate</span>(<span class="hljs-number">0deg</span>);
  }
  <span class="hljs-selector-tag">to</span> {
    <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">rotate</span>(<span class="hljs-number">360deg</span>);
  }
}
<span class="hljs-selector-class">.spinner</span> {
  <span class="hljs-attribute">width</span>: <span class="hljs-number">50px</span>;
  <span class="hljs-attribute">height</span>: <span class="hljs-number">50px</span>;
  <span class="hljs-attribute">border</span>: <span class="hljs-number">5px</span> solid <span class="hljs-number">#f3f4f6</span>;
  <span class="hljs-attribute">border-top-color</span>: <span class="hljs-number">#3b82f6</span>;
  <span class="hljs-attribute">border-radius</span>: <span class="hljs-number">50%</span>;
  <span class="hljs-comment">/* 1秒で1回転、無限ループ */</span>
  <span class="hljs-attribute">animation</span>: spin <span class="hljs-number">1s</span> linear infinite;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;spinner&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
</div>
</div>
<ul>
<li>円形（<code>border-radius: 50%</code>）</li>
<li>上部だけ色を変える（<code>border-top-color</code>）</li>
<li>回転アニメーション（<code>rotate(360deg)</code>）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%91%E3%83%95%E3%82%A9%E3%83%BC%E3%83%9E%E3%83%B3%E3%82%B9%E3%81%AE%E6%B3%A8%E6%84%8F%E7%82%B9">パフォーマンスの注意点</h2>
<h3 id="%E2%9A%A1-%E9%AB%98%E9%80%9F%E3%81%AA%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3gpu-%E3%82%A2%E3%82%AF%E3%82%BB%E3%83%A9%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a1.svg" data-marp-twemoji=""/> 高速なプロパティ（GPU アクセラレーション）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 推奨：GPUで処理されるので高速 */</span>
<span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(<span class="hljs-number">100px</span>);
  <span class="hljs-attribute">opacity</span>: <span class="hljs-number">0.5</span>;
}
</code></pre>
<p><strong>GPU アクセラレーション</strong>：</p>
<ul>
<li><code>transform</code>（translate, scale, rotate）</li>
<li><code>opacity</code></li>
</ul>
<p><strong>これらは超高速！</strong> 60fps のスムーズなアニメーションが可能！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%91%E3%83%95%E3%82%A9%E3%83%BC%E3%83%9E%E3%83%B3%E3%82%B9%E3%81%AE%E6%B3%A8%E6%84%8F%E7%82%B9%E7%B6%9A%E3%81%8D">パフォーマンスの注意点（続き）</h2>
<h3 id="%F0%9F%90%8C-%E4%BD%8E%E9%80%9F%E3%81%AA%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3cpu-%E3%81%A7%E5%87%A6%E7%90%86"><img class="emoji" draggable="false" alt="🐌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f40c.svg" data-marp-twemoji=""/> 低速なプロパティ（CPU で処理）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 非推奨：CPUで処理されるので遅い */</span>
<span class="hljs-selector-class">.box</span> {
  <span class="hljs-attribute">left</span>: <span class="hljs-number">100px</span>; <span class="hljs-comment">/* 代わりにtransform: translateX()を使う */</span>
  <span class="hljs-attribute">width</span>: <span class="hljs-number">200px</span>; <span class="hljs-comment">/* サイズ変更は重い */</span>
}
</code></pre>
<h3 id="%E3%83%91%E3%83%95%E3%82%A9%E3%83%BC%E3%83%9E%E3%83%B3%E3%82%B9%E6%94%B9%E5%96%84%E3%81%AE%E3%82%B3%E3%83%84">パフォーマンス改善のコツ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* 悪い例：leftでアニメーション */</span>
<span class="hljs-selector-class">.box</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">left</span>: <span class="hljs-number">100px</span>; <span class="hljs-comment">/* 遅い */</span>
}
<span class="hljs-comment">/* 良い例：transformでアニメーション */</span>
<span class="hljs-selector-class">.box</span><span class="hljs-selector-pseudo">:hover</span> {
  <span class="hljs-attribute">transform</span>: <span class="hljs-built_in">translateX</span>(<span class="hljs-number">100px</span>); <span class="hljs-comment">/* 高速 */</span>
}
</code></pre>
<p><strong>重要！</strong> 位置の変更には <code>left</code> ではなく <code>transform: translateX()</code> を使おう！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-5-css-%E3%82%A2%E3%83%8B%E3%83%A1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%81%BE%E3%81%A8%E3%82%81">Lesson 5: CSS アニメーションまとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>CSS アニメーションの 2 つの方法</strong>（transition と animation）</li>
<li><strong>transition の基本</strong>（property, duration, timing-function, delay）</li>
<li><strong>transform</strong>（translate, scale, rotate）</li>
<li><strong>@keyframes で複雑なアニメーションを定義</strong></li>
<li><strong>animation プロパティ</strong>（iteration-count, direction, fill-mode）</li>
<li><strong>パフォーマンスの注意点</strong>（GPU アクセラレーション）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="phase-2-%E3%81%AE%E3%81%BE%E3%81%A8%E3%82%81">Phase 2 のまとめ</h2>
<ul>
<li>HTML フォームでユーザー入力を受け取れる</li>
<li>Flexbox で柔軟な 1 次元レイアウトが作れる</li>
<li>Grid で複雑な 2 次元レイアウトが作れる</li>
<li>レスポンシブデザインで全デバイスに対応できる</li>
<li>CSS アニメーションで魅力的な動きを追加できる</li>
</ul>
</section>
