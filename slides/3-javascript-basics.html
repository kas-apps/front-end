<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">calculateFinalPrice</span>(<span class="hljs-number">10000</span>, <span class="hljs-number">0.1</span>, <span class="hljs-number">0.2</span>)); <span class="hljs-comment">// → 8800</span>
</code></pre>
<p><strong>関数を組み合わせると、複雑な処理も分かりやすく書けるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-3-%E9%96%A2%E6%95%B0%E3%81%AE%E5%9F%BA%E6%9C%AC%E3%81%BE%E3%81%A8%E3%82%81">Lesson 3: 関数の基本まとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>関数宣言</strong>：<code>function</code> で関数を定義</li>
<li><strong>引数</strong>：関数に値を渡す、デフォルト値も設定できる</li>
<li><strong>戻り値</strong>：<code>return</code> で結果を返す</li>
<li><strong>関数式</strong>：関数を変数に代入</li>
<li><strong>アロー関数</strong>：<code>=&gt;</code> で短く書ける</li>
</ul>
<h3 id="%E9%87%8D%E8%A6%81%E3%81%AA%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88-1">重要なポイント</h3>
<ol>
<li><strong>関数名は「何をするか」が分かる名前にする</strong></li>
<li><strong>return で値を返すのを忘れずに</strong></li>
<li><strong>モダンな JavaScript ではアロー関数をよく使う</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-4">Lesson 4</h1>
<h1 id="%E9%85%8D%E5%88%97%E3%81%A8%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88-%F0%9F%93%A6">配列とオブジェクト <img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-4-%E9%85%8D%E5%88%97%E3%81%A8%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88-%F0%9F%93%A6-1">Lesson 4: 配列とオブジェクト <img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：配列とオブジェクトを使って複数のデータをまとめて管理でき、配列メソッドで効率的にデータを処理できるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C%E9%85%8D%E5%88%97%E3%81%A8%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ配列とオブジェクトを学ぶの？</h3>
<p>今まで学んだ変数では、1 つの値しか保存できなかった。でも実際のプログラムでは、たくさんのデータをまとめて扱いたい場面が多い！</p>
<ul>
<li>ユーザーのリスト</li>
<li>商品のカタログ</li>
<li>ToDo リスト</li>
<li>成績データ</li>
</ul>
<p><strong>配列とオブジェクトを使えば、複数のデータをスマートに管理できるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97array%E3%83%AA%E3%82%B9%E3%83%88%E5%BD%A2%E5%BC%8F%E3%81%AE%E3%83%87%E3%83%BC%E3%82%BF">配列（Array）：リスト形式のデータ</h2>
<p><strong>配列は、複数の値を順番に並べて保存できるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 空の配列</span>
<span class="hljs-keyword">const</span> emptyArray = [];

<span class="hljs-comment">// 数値の配列</span>
<span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>];

<span class="hljs-comment">// 文字列の配列</span>
<span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(numbers); <span class="hljs-comment">// → [1, 2, 3, 4, 5]</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits); <span class="hljs-comment">// → [&quot;りんご&quot;, &quot;バナナ&quot;, &quot;みかん&quot;]</span>
</code></pre>
<p><strong>例え話</strong>：配列は「順番に並んだ箱」みたいなもの！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">fruits 配列
┌─────────┬─────────┬─────────┐
│   [0]   │   [1]   │   [2]   │ ← インデックス
├─────────┼─────────┼─────────┤
│ &quot;りんご&quot; │ &quot;バナナ&quot; | &quot;みかん&quot; | ← 要素
└─────────┴─────────┴─────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97%E3%81%AE%E8%A6%81%E7%B4%A0%E3%81%AB%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9">配列の要素にアクセス</h2>
<p><strong>インデックス（番号）を使って、配列の各要素にアクセスできるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits[<span class="hljs-number">0</span>]); <span class="hljs-comment">// → りんご（最初の要素）</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits[<span class="hljs-number">1</span>]); <span class="hljs-comment">// → バナナ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits[<span class="hljs-number">2</span>]); <span class="hljs-comment">// → みかん（最後の要素）</span>
</code></pre>
<p><strong>重要</strong>：配列のインデックスは <strong>0 から始まる</strong>！</p>
<h3 id="%E9%85%8D%E5%88%97%E3%81%AE%E9%95%B7%E3%81%95length">配列の長さ（length）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits.<span class="hljs-property">length</span>); <span class="hljs-comment">// → 3</span>

<span class="hljs-comment">// 最後の要素にアクセス</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits[fruits.<span class="hljs-property">length</span> - <span class="hljs-number">1</span>]); <span class="hljs-comment">// → みかん</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97%E3%81%AE%E5%9F%BA%E6%9C%AC%E6%93%8D%E4%BD%9C">配列の基本操作</h2>
<h3 id="push-%E6%9C%AB%E5%B0%BE%E3%81%AB%E8%BF%BD%E5%8A%A0">push(): 末尾に追加</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>];

fruits.<span class="hljs-title function_">push</span>(<span class="hljs-string">&quot;みかん&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits); <span class="hljs-comment">// → [&quot;りんご&quot;, &quot;バナナ&quot;, &quot;みかん&quot;]</span>

fruits.<span class="hljs-title function_">push</span>(<span class="hljs-string">&quot;ぶどう&quot;</span>, <span class="hljs-string">&quot;いちご&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits); <span class="hljs-comment">// → [&quot;りんご&quot;, &quot;バナナ&quot;, &quot;みかん&quot;, &quot;ぶどう&quot;, &quot;いちご&quot;]</span>
</code></pre>
<h3 id="pop-%E6%9C%AB%E5%B0%BE%E3%81%8B%E3%82%89%E5%89%8A%E9%99%A4">pop(): 末尾から削除</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-keyword">const</span> removed = fruits.<span class="hljs-title function_">pop</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(removed); <span class="hljs-comment">// → みかん（削除された要素）</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruits); <span class="hljs-comment">// → [&quot;りんご&quot;, &quot;バナナ&quot;]</span>
</code></pre>
<p><strong>例え話</strong>：<code>push()</code>は箱を積み上げる、<code>pop()</code>は積み上げた箱を上から取るイメージ</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97%E3%81%AE%E5%8F%8D%E5%BE%A9%E5%87%A6%E7%90%86">配列の反復処理</h2>
<div class="flex gap-x-1">
<div class="flex-1">
<h3 id="for-%E3%83%AB%E3%83%BC%E3%83%97">for ループ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; fruits.<span class="hljs-property">length</span>; i++) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${fruits[i]}</span>`</span>);
}
<span class="hljs-comment">// → りんご</span>
<span class="hljs-comment">// → バナナ</span>
<span class="hljs-comment">// → みかん</span>
</code></pre>
</div>
<div class="flex-1">
<h3 id="forof-%E3%83%AB%E3%83%BC%E3%83%97%E6%8E%A8%E5%A5%A8">for...of ループ（推奨）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> fruits = [<span class="hljs-string">&quot;りんご&quot;</span>, <span class="hljs-string">&quot;バナナ&quot;</span>, <span class="hljs-string">&quot;みかん&quot;</span>];

<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> fruit <span class="hljs-keyword">of</span> fruits) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fruit);
}
<span class="hljs-comment">// → りんご</span>
<span class="hljs-comment">// → バナナ</span>
<span class="hljs-comment">// → みかん</span>
</code></pre>
<p><strong><code>for...of</code> の方がシンプルで読みやすい！</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97%E3%83%A1%E3%82%BD%E3%83%83%E3%83%89">配列メソッド</h2>
<p><strong>配列には便利なメソッドがたくさんあるよ！</strong></p>
<ul>
<li>map(): 各要素を変換して新しい配列を作る</li>
<li>filter(): 条件に合う要素だけを抽出</li>
<li>reduce(): 配列を1つの値にまとめる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="map-%E5%90%84%E8%A6%81%E7%B4%A0%E3%82%92%E5%A4%89%E6%8F%9B%E3%81%97%E3%81%A6%E6%96%B0%E3%81%97%E3%81%84%E9%85%8D%E5%88%97%E3%82%92%E4%BD%9C%E3%82%8B">map(): 各要素を変換して新しい配列を作る</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>];

<span class="hljs-keyword">const</span> doubled = numbers.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">num</span>) =&gt;</span> num * <span class="hljs-number">2</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(doubled); <span class="hljs-comment">// → [2, 4, 6, 8, 10]</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(numbers); <span class="hljs-comment">// → [1, 2, 3, 4, 5]（元の配列はそのまま）</span>
</code></pre>
<p><strong><code>map</code> は元の配列を変更せず、新しい配列を返す！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="filter-%E6%9D%A1%E4%BB%B6%E3%81%AB%E5%90%88%E3%81%86%E8%A6%81%E7%B4%A0%E3%81%A0%E3%81%91%E3%82%92%E6%8A%BD%E5%87%BA">filter(): 条件に合う要素だけを抽出</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>, <span class="hljs-number">6</span>, <span class="hljs-number">7</span>, <span class="hljs-number">8</span>, <span class="hljs-number">9</span>, <span class="hljs-number">10</span>];

<span class="hljs-keyword">const</span> evenNumbers = numbers.<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">num</span>) =&gt;</span> num % <span class="hljs-number">2</span> === <span class="hljs-number">0</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(evenNumbers); <span class="hljs-comment">// → [2, 4, 6, 8, 10]</span>

<span class="hljs-keyword">const</span> largeNumbers = numbers.<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">num</span>) =&gt;</span> num &gt; <span class="hljs-number">5</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(largeNumbers); <span class="hljs-comment">// → [6, 7, 8, 9, 10]</span>
</code></pre>
<p><strong><code>filter</code> は条件に合う要素だけの新しい配列を返す！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="reduce-%E9%85%8D%E5%88%97%E3%82%921%E3%81%A4%E3%81%AE%E5%80%A4%E3%81%AB%E3%81%BE%E3%81%A8%E3%82%81%E3%82%8B">reduce(): 配列を1つの値にまとめる</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> numbers = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>];

<span class="hljs-comment">// reduce(コールバック関数, 初期値)</span>
<span class="hljs-comment">// 合計を計算</span>
<span class="hljs-keyword">const</span> sum = numbers.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">accumulator, current</span>) =&gt;</span> {
  <span class="hljs-keyword">return</span> accumulator + current;
}, <span class="hljs-number">0</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(sum); <span class="hljs-comment">// → 15</span>

<span class="hljs-comment">// 短く書くと</span>
<span class="hljs-keyword">const</span> sum2 = numbers.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">acc, cur</span>) =&gt;</span> acc + cur, <span class="hljs-number">0</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(sum2); <span class="hljs-comment">// → 15</span>
</code></pre>
<p><strong><code>reduce</code> は配列を1つの値に「畳み込む」処理！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E9%85%8D%E5%88%97%E3%83%A1%E3%82%BD%E3%83%83%E3%83%89%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B">実践例：配列メソッドの組み合わせ</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> scores = [<span class="hljs-number">85</span>, <span class="hljs-number">92</span>, <span class="hljs-number">78</span>, <span class="hljs-number">65</span>, <span class="hljs-number">88</span>, <span class="hljs-number">95</span>, <span class="hljs-number">72</span>, <span class="hljs-number">90</span>];

<span class="hljs-comment">// 80点以上の点数だけを抽出して、2倍にする</span>
<span class="hljs-keyword">const</span> result = scores
  .<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">score</span>) =&gt;</span> score &gt;= <span class="hljs-number">80</span>) <span class="hljs-comment">// 80点以上</span>
  .<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">score</span>) =&gt;</span> score * <span class="hljs-number">2</span>); <span class="hljs-comment">// 2倍</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(result); <span class="hljs-comment">// → [170, 184, 176, 190, 180]</span>

<span class="hljs-comment">// 平均を計算</span>
<span class="hljs-keyword">const</span> average = scores.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">acc, score</span>) =&gt;</span> acc + score, <span class="hljs-number">0</span>) / scores.<span class="hljs-property">length</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`平均点: <span class="hljs-subst">${average}</span>`</span>); <span class="hljs-comment">// → 平均点: 83.125</span>
</code></pre>
<p><strong>メソッドチェーンで、複雑な処理も読みやすく書ける！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88object%E3%82%AD%E3%83%BC%E3%81%A8%E5%80%A4%E3%81%AE%E3%83%9A%E3%82%A2">オブジェクト（Object）：キーと値のペア</h2>
<p><strong>オブジェクトは、名前（キー）と値のペアでデータを管理するよ！</strong></p>
<h3 id="%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%81%AE%E4%BD%9C%E6%88%90">オブジェクトの作成</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 空のオブジェクト</span>
<span class="hljs-keyword">const</span> emptyObject = {};

<span class="hljs-comment">// ユーザー情報</span>
<span class="hljs-keyword">const</span> user = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Taro&quot;</span>,
  <span class="hljs-attr">age</span>: <span class="hljs-number">25</span>,
  <span class="hljs-attr">city</span>: <span class="hljs-string">&quot;Tokyo&quot;</span>,
  <span class="hljs-attr">isActive</span>: <span class="hljs-literal">true</span>,
};

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user);
<span class="hljs-comment">// → { name: &#x27;Taro&#x27;, age: 25, city: &#x27;Tokyo&#x27;, isActive: true }</span>
</code></pre>
<p><strong>例え話</strong>：オブジェクトは「名前付きの箱」の集合！各箱にラベル（キー）が付いている！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3%E3%81%B8%E3%81%AE%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9">プロパティへのアクセス</h2>
<h3 id="%E3%83%89%E3%83%83%E3%83%88%E8%A8%98%E6%B3%95">ドット記法</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> user = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;太郎&quot;</span>,
  <span class="hljs-attr">age</span>: <span class="hljs-number">25</span>,
};

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user.<span class="hljs-property">name</span>); <span class="hljs-comment">// → 太郎</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user.<span class="hljs-property">age</span>); <span class="hljs-comment">// → 25</span>
</code></pre>
<h3 id="%E3%83%96%E3%83%A9%E3%82%B1%E3%83%83%E3%83%88%E8%A8%98%E6%B3%95">ブラケット記法</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> user = {
  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;太郎&quot;</span>,
  <span class="hljs-attr">age</span>: <span class="hljs-number">25</span>,
};

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user[<span class="hljs-string">&quot;name&quot;</span>]); <span class="hljs-comment">// → 太郎</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user[<span class="hljs-string">&quot;age&quot;</span>]); <span class="hljs-comment">// → 25</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%85%8D%E5%88%97%E3%81%A8%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%81%AE%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B">配列とオブジェクトの組み合わせ</h2>
<p><strong>実際のアプリでは、配列とオブジェクトを組み合わせて使うよ！</strong></p>
<h3 id="%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%81%AE%E9%85%8D%E5%88%97">オブジェクトの配列</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> users = [
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;太郎&quot;</span>, <span class="hljs-attr">age</span>: <span class="hljs-number">25</span>, <span class="hljs-attr">city</span>: <span class="hljs-string">&quot;東京&quot;</span> },
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;花子&quot;</span>, <span class="hljs-attr">age</span>: <span class="hljs-number">22</span>, <span class="hljs-attr">city</span>: <span class="hljs-string">&quot;大阪&quot;</span> },
  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;次郎&quot;</span>, <span class="hljs-attr">age</span>: <span class="hljs-number">30</span>, <span class="hljs-attr">city</span>: <span class="hljs-string">&quot;名古屋&quot;</span> },
];

<span class="hljs-comment">// 各ユーザーの名前を表示</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> user <span class="hljs-keyword">of</span> users) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(user.<span class="hljs-property">name</span>);
}
<span class="hljs-comment">// → 太郎</span>
<span class="hljs-comment">// → 花子</span>
<span class="hljs-comment">// → 次郎</span>

<span class="hljs-comment">// 25歳以上のユーザーを抽出</span>
<span class="hljs-keyword">const</span> adults = users.<span class="hljs-title function_">filter</span>(<span class="hljs-function">(<span class="hljs-params">user</span>) =&gt;</span> user.<span class="hljs-property">age</span> &gt;= <span class="hljs-number">25</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(adults);
<span class="hljs-comment">// → [{ name: &quot;太郎&quot;, ... }, { name: &quot;次郎&quot;, ... }]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-4-%E9%85%8D%E5%88%97%E3%81%A8%E3%82%AA%E3%83%96%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%E3%81%BE%E3%81%A8%E3%82%81">Lesson 4: 配列とオブジェクトまとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>配列</strong>：複数の値をリスト形式で管理</li>
<li><strong>配列メソッド</strong>：map, filter, reduce など</li>
<li><strong>オブジェクト</strong>：キーと値のペアでデータを管理</li>
<li><strong>オブジェクトの配列</strong>：複数のオブジェクトをリスト形式で管理</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-5">Lesson 5</h1>
<h1 id="%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA-dom-%E6%93%8D%E4%BD%9C-%F0%9F%8E%AF">基本的な DOM 操作 <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-5-%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA-dom-%E6%93%8D%E4%BD%9C-%F0%9F%8E%AF-1">Lesson 5: 基本的な DOM 操作 <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：JavaScript を使って HTML 要素を操作でき、ユーザーのクリックなどのイベントに反応できるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-dom-%E6%93%8D%E4%BD%9C%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ DOM 操作を学ぶの？</h3>
<p>ここまで学んだ JavaScript の基礎だけでは、実際の Web ページに変化を起こせない...</p>
<p><strong>DOM 操作を使えば、ボタンをクリックしたら色が変わる、テキストが変わる、要素が追加される、といった動きのある Web ページが作れるよ！</strong></p>
<h3 id="%E3%81%A7%E3%81%8D%E3%82%8B%E3%82%88%E3%81%86%E3%81%AB%E3%81%AA%E3%82%8B%E3%81%93%E3%81%A8">できるようになること</h3>
<ul>
<li>ボタンをクリックしたら文字が変わる</li>
<li>入力した内容をページに表示する</li>
<li>要素の色やスタイルを動的に変更する</li>
<li>新しい要素を追加・削除する</li>
</ul>
<p><strong>これで初めて「動きのある Web サイト」が作れるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="dom-%E3%81%A8%E3%81%AF">DOM とは？</h2>
<p><strong>DOM（Document Object Model）は、HTML をJavaScript で操作できるようにしたもの！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">HTML（静的な文書）
    <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>
  ブラウザが DOM を構築
    <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>
DOM（JavaScriptで操作できるオブジェクト）
    <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>
  JavaScript で変更
    <img class="emoji" draggable="false" alt="⬇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2b07.svg" data-marp-twemoji=""/>
ブラウザに反映
</code></pre>
<p><strong>例え話</strong>：HTML は設計図、DOM はその設計図を元にブロックで作られた建物！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E8%A6%81%E7%B4%A0%E3%81%AE%E5%8F%96%E5%BE%97">要素の取得</h2>
<h3 id="queryselector-css-%E3%82%BB%E3%83%AC%E3%82%AF%E3%82%BF%E3%81%A7%E5%8F%96%E5%BE%97">querySelector(): CSS セレクタで取得</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>DOM操作<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;script.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;title&quot;</span>&gt;</span>こんにちは<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;message&quot;</span>&gt;</span>これはメッセージです<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;btn&quot;</span>&gt;</span>クリック<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// IDで取得</span>
<span class="hljs-keyword">const</span> title = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#title&quot;</span>);
<span class="hljs-comment">// クラスで取得（最初の1つだけ）</span>
<span class="hljs-keyword">const</span> message = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;.message&quot;</span>);
<span class="hljs-comment">// タグ名で取得</span>
<span class="hljs-keyword">const</span> button = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;button&quot;</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="queryselectorall-%E8%A4%87%E6%95%B0%E3%81%AE%E8%A6%81%E7%B4%A0%E3%82%92%E5%8F%96%E5%BE%97">querySelectorAll(): 複数の要素を取得</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>項目1<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>項目2<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>項目3<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// すべてのli要素を取得</span>
<span class="hljs-keyword">const</span> items = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelectorAll</span>(<span class="hljs-string">&quot;li&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(items.<span class="hljs-property">length</span>); <span class="hljs-comment">// → 3</span>

<span class="hljs-comment">// for of で繰り返し処理</span>
<span class="hljs-keyword">for</span> (<span class="hljs-keyword">const</span> item <span class="hljs-keyword">of</span> items) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(item.<span class="hljs-property">textContent</span>);
}
<span class="hljs-comment">// → 項目1</span>
<span class="hljs-comment">// → 項目2</span>
<span class="hljs-comment">// → 項目3</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E8%A6%81%E7%B4%A0%E3%81%AE%E5%86%85%E5%AE%B9%E3%82%92%E5%A4%89%E6%9B%B4%E3%81%99%E3%82%8B">要素の内容を変更する</h2>
<h3 id="textcontent-%E3%83%86%E3%82%AD%E3%82%B9%E3%83%88%E3%81%AE%E3%81%BF%E3%82%92%E5%A4%89%E6%9B%B4">textContent: テキストのみを変更</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;message&quot;</span>&gt;</span>元のメッセージ<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> message = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#message&quot;</span>);

<span class="hljs-comment">// テキストを変更</span>
message.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;新しいメッセージ！&quot;</span>;
</code></pre>
<h3 id="innerhtml-html-%E3%82%BF%E3%82%B0%E3%82%82%E5%90%AB%E3%82%81%E3%81%A6%E5%A4%89%E6%9B%B4">innerHTML: HTML タグも含めて変更</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;content&quot;</span>&gt;</span>元のコンテンツ<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> content = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#content&quot;</span>);

<span class="hljs-comment">// HTMLタグも含めて変更</span>
content.<span class="hljs-property">innerHTML</span> = <span class="hljs-string">&quot;&lt;strong&gt;太字のテキスト&lt;/strong&gt;&quot;</span>;
</code></pre>
<p><strong>注意</strong>：<code>innerHTML</code> はセキュリティリスクがあるので、ユーザー入力を直接入れないように！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%B9%E3%82%BF%E3%82%A4%E3%83%AB%E3%81%AE%E5%A4%89%E6%9B%B4">スタイルの変更</h2>
<h3 id="style-%E3%83%97%E3%83%AD%E3%83%91%E3%83%86%E3%82%A3">style プロパティ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;text&quot;</span>&gt;</span>このテキストの色・背景色・サイズを変更します<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> text = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#text&quot;</span>);

<span class="hljs-comment">// 色を変更</span>
text.<span class="hljs-property">style</span>.<span class="hljs-property">color</span> = <span class="hljs-string">&quot;red&quot;</span>;

<span class="hljs-comment">// 背景色を変更</span>
text.<span class="hljs-property">style</span>.<span class="hljs-property">backgroundColor</span> = <span class="hljs-string">&quot;yellow&quot;</span>;

<span class="hljs-comment">// フォントサイズを変更</span>
text.<span class="hljs-property">style</span>.<span class="hljs-property">fontSize</span> = <span class="hljs-string">&quot;24px&quot;</span>;
</code></pre>
<p><strong>注意</strong>：CSS のプロパティ名は、ケバブケースからキャメルケースに変わる！</p>
<ul>
<li>CSS: <code>background-color</code></li>
<li>JavaScript: <code>backgroundColor</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%AF%E3%83%A9%E3%82%B9%E3%81%AE%E6%93%8D%E4%BD%9C">クラスの操作</h2>
<h3 id="classlist">classList</h3>
<div class="flex gap-x-1">
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-selector-class">.highlight</span> {
  <span class="hljs-attribute">background-color</span>: yellow;
  <span class="hljs-attribute">font-weight</span>: bold;
}
<span class="hljs-selector-class">.large</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">24px</span>;
}
</code></pre>
</div>
<div class="flex-1">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;text&quot;</span>&gt;</span>
  このテキストにクラスを追加します
<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> text = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#text&quot;</span>);

<span class="hljs-comment">// クラスを追加</span>
text.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&quot;highlight&quot;</span>);
<span class="hljs-comment">// 複数のクラスを追加</span>
text.<span class="hljs-property">classList</span>.<span class="hljs-title function_">add</span>(<span class="hljs-string">&quot;highlight&quot;</span>, <span class="hljs-string">&quot;large&quot;</span>);
<span class="hljs-comment">// クラスを削除</span>
text.<span class="hljs-property">classList</span>.<span class="hljs-title function_">remove</span>(<span class="hljs-string">&quot;highlight&quot;</span>);
<span class="hljs-comment">// クラスをトグル（あれば削除、なければ追加）</span>
text.<span class="hljs-property">classList</span>.<span class="hljs-title function_">toggle</span>(<span class="hljs-string">&quot;highlight&quot;</span>);
</code></pre>
<p><strong><code>classList</code> を使うと、CSS で定義したスタイルを簡単に切り替えられる！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88%E3%83%AA%E3%82%B9%E3%83%8A%E3%83%BC">イベントリスナー</h2>
<h3 id="addeventlistener-%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88%E3%81%AB%E5%8F%8D%E5%BF%9C%E3%81%99%E3%82%8B">addEventListener(): イベントに反応する</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;btn&quot;</span>&gt;</span>クリックしてね<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;message&quot;</span>&gt;</span>まだクリックされていません<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> btn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#btn&quot;</span>);
<span class="hljs-keyword">const</span> message = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#message&quot;</span>);

<span class="hljs-comment">// クリックイベントを登録</span>
btn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  message.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;ボタンがクリックされました！&quot;</span>;
});
</code></pre>
<p><strong><code>addEventListener</code> で、ユーザーの操作に反応できる！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%88%E3%81%8F%E4%BD%BF%E3%81%86%E3%82%A4%E3%83%99%E3%83%B3%E3%83%88">よく使うイベント</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// クリック</span>
element.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;クリックされた&quot;</span>);
});

<span class="hljs-comment">// マウスオーバー</span>
element.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;mouseover&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;マウスが乗った&quot;</span>);
});

<span class="hljs-comment">// 入力</span>
input.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;input&quot;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;入力内容:&quot;</span>, event.<span class="hljs-property">target</span>.<span class="hljs-property">value</span>);
});

<span class="hljs-comment">// フォーム送信</span>
form.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;submit&quot;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  event.<span class="hljs-title function_">preventDefault</span>(); <span class="hljs-comment">// デフォルトの送信を防ぐ</span>
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;フォームが送信された&quot;</span>);
});
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E8%A6%81%E7%B4%A0%E3%81%AE%E4%BD%9C%E6%88%90%E3%81%A8%E8%BF%BD%E5%8A%A0">要素の作成と追加</h2>
<h3 id="createelement-%E6%96%B0%E3%81%97%E3%81%84%E8%A6%81%E7%B4%A0%E3%82%92%E4%BD%9C%E3%82%8B">createElement(): 新しい要素を作る</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;container&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> container = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#container&quot;</span>);

<span class="hljs-comment">// 新しいp要素を作成</span>
<span class="hljs-keyword">const</span> newParagraph = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;p&quot;</span>);
newParagraph.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;これは新しく追加された段落です&quot;</span>;

<span class="hljs-comment">// コンテナに追加</span>
container.<span class="hljs-title function_">appendChild</span>(newParagraph);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8Btodo-%E3%83%AA%E3%82%B9%E3%83%88">実践例：TODO リスト</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;text&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;todo-input&quot;</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;やることを入力&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;add-btn&quot;</span>&gt;</span>追加<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;todo-list&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> input = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#todo-input&quot;</span>);
<span class="hljs-keyword">const</span> addBtn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#add-btn&quot;</span>);
<span class="hljs-keyword">const</span> todoList = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&quot;#todo-list&quot;</span>);
addBtn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> value = input.<span class="hljs-property">value</span>.<span class="hljs-title function_">trim</span>();
  <span class="hljs-keyword">if</span> (value !== <span class="hljs-string">&quot;&quot;</span>) {
    <span class="hljs-keyword">const</span> todoItem = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;div&quot;</span>);
    <span class="hljs-keyword">const</span> text = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;span&quot;</span>);
    text.<span class="hljs-property">textContent</span> = value;
    <span class="hljs-keyword">const</span> deleteBtn = <span class="hljs-variable language_">document</span>.<span class="hljs-title function_">createElement</span>(<span class="hljs-string">&quot;button&quot;</span>);
    deleteBtn.<span class="hljs-property">textContent</span> = <span class="hljs-string">&quot;削除&quot;</span>;
    deleteBtn.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;click&quot;</span>, <span class="hljs-function">() =&gt;</span> {
      todoItem.<span class="hljs-title function_">remove</span>();
    });
    todoItem.<span class="hljs-title function_">appendChild</span>(text);
    todoItem.<span class="hljs-title function_">appendChild</span>(deleteBtn);
    todoList.<span class="hljs-title function_">appendChild</span>(todoItem);
    input.<span class="hljs-property">value</span> = <span class="hljs-string">&quot;&quot;</span>;
  }
});
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E3%82%AB%E3%82%A6%E3%83%B3%E3%82%BF%E3%83%BC">実践例：カウンター</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;count&quot;</span>&gt;</span>0<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;increment&quot;</span>&gt;</span>+1<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;decrement&quot;</span>&gt;</span>-1<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;reset&quot;</span>&gt;</span>リセット<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> count = <span class="hljs-number">0</span>;

<h2 id="lesson-5-%E5%9F%BA%E6%9C%AC%E7%9A%84%E3%81%AA-dom-%E6%93%8D%E4%BD%9C%E3%81%BE%E3%81%A8%E3%82%81">Lesson 5: 基本的な DOM 操作まとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>DOM</strong>：JavaScript で HTML を操作できる</li>
<li><strong>要素の取得</strong>：<code>querySelector()</code> で要素を取得</li>
<li><strong>内容の変更</strong>：<code>textContent</code>, <code>innerHTML</code></li>
<li><strong>スタイルの変更</strong>：<code>style</code>, <code>classList</code></li>
<li><strong>イベント</strong>：<code>addEventListener</code> でユーザーの操作に反応</li>
<li><strong>要素の作成・追加・削除</strong>：動的に DOM を操作</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="phase-3-%E3%81%BE%E3%81%A8%E3%82%81">Phase 3 まとめ</h2>
<p>Phase 3 で学んだこと：</p>
<ul>
<li><strong>JavaScript 基礎文法</strong>：変数、データ型、演算子、テンプレートリテラル</li>
<li><strong>条件分岐とループ</strong>：if, for, while で複雑な処理を書ける</li>
<li><strong>関数</strong>：コードを再利用できる、アロー関数で短く書ける</li>
<li><strong>配列とオブジェクト</strong>：複数のデータを管理できる、map/filter/reduce が便利</li>
<li><strong>DOM 操作</strong>：動きのある Web ページが作れる</li>
</ul>
<h6 id="%E3%81%93%E3%82%8C%E3%81%A7-javascript-%E3%81%AE%E5%9F%BA%E7%A4%8E%E3%81%AF%E5%AE%8C%E7%92%A7">これで JavaScript の基礎は完璧！</h6>
</section>
