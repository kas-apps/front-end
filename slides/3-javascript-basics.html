<p>Phase 1・2 では、HTML/CSS で <strong>見た目</strong> を作る方法を学んだね。でも、それだけでは「静的な文書」しか作れない。</p>
<p><strong>動きのある Web ページを作るには、プログラミングが必要！</strong></p>
<h3 id="phase-3-%E3%81%AE%E3%82%B4%E3%83%BC%E3%83%AB">Phase 3 のゴール</h3>

<li>条件分岐とループで複雑な処理を書ける</li>

<li>配列とオブジェクトでデータを管理できる</li>
<li>DOM 操作で動きのある Web ページを作れる</li>
</ul>

<p><strong>学習目標</strong>：JavaScript の基本的な文法を理解し、変数、データ型、演算子を使ってシンプルなプログラムが書けるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C-javascript-%E5%9F%BA%E7%A4%8E%E6%96%87%E6%B3%95%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ JavaScript 基礎文法を学ぶの？</h3>
<p>「ボタンをクリックしたら〇〇する」「ユーザーの入力に応じて ×× する」みたいな動きのある Web ページを作るには、プログラミングが必要！</p>
<p>JavaScript は、Web ブラウザで動く唯一のプログラミング言語だから、フロントエンド開発には絶対に必要なんだ！</p>
<p><strong>まずは基礎文法を学んで、プログラミングの第一歩を踏み出そう！</strong></p>

  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript を試してみよう<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">
      <span class="hljs-comment">// ここに JavaScript を書く</span>
      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, JavaScript!&quot;</span>);
    </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
<p><strong>ブラウザでこのファイルを開いて、F12 キーを押して Console タブを見てみよう！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="javascript-%E3%82%92%E5%AE%9F%E8%A1%8C%E3%81%99%E3%82%8B%E6%96%B9%E6%B3%95%E7%B6%9A%E3%81%8D">JavaScript を実行する方法（続き）</h2>
<h3 id="%E6%96%B9%E6%B3%95-2-%E5%A4%96%E9%83%A8%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%81%A8%E3%81%97%E3%81%A6%E8%AA%AD%E3%81%BF%E8%BE%BC%E3%82%80">方法 2: 外部ファイルとして読み込む</h3>
<div class="flex gap-x-1">
<div class="flex-1">
<p><strong>HTML ファイル（index.html）</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>JavaScript テスト<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h1</span>&gt;</span>JavaScript を試してみよう<span class="hljs-tag">&lt;/<span class="hljs-name">h1</span>&gt;</span>
    <span class="hljs-comment">&lt;!-- 外部のJavaScriptファイルを読み込む --&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;script.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>
</code></pre>
</div>
<div class="flex-1">
<p><strong>JavaScript ファイル（script.js）</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// ここに JavaScript を書く</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello, JavaScript!&quot;</span>);

</code></pre>
</div>
</div>
<p><strong>ファイルを分けると、コードが整理されて読みやすくなるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="javascript-%E3%82%92%E5%AE%9F%E8%A1%8C%E3%81%99%E3%82%8B%E6%96%B9%E6%B3%95%E7%B6%9A%E3%81%8D-1">JavaScript を実行する方法（続き）</h2>
<h3 id="%E6%96%B9%E6%B3%95-3-%E3%83%96%E3%83%A9%E3%82%A6%E3%82%B6%E3%81%AE-console-%E3%81%A7%E7%9B%B4%E6%8E%A5%E5%AE%9F%E8%A1%8C%E7%B7%B4%E7%BF%92%E3%81%AB%E6%9C%80%E9%81%A9">方法 3: ブラウザの Console で直接実行（練習に最適！）</h3>
<ol>
<li>ブラウザで F12 キーを押す</li>
<li>Console タブを開く</li>
<li>直接 JavaScript を入力して Enter</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Hello!&quot;</span>);
</code></pre>
<p><strong>すぐに結果が見られるから、練習に最適！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%A4%89%E6%95%B0%E3%83%87%E3%83%BC%E3%82%BF%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B%E7%AE%B1">変数：データを入れる箱</h2>
<p>プログラミングでは、<strong>データを保存して後で使う</strong>ことがよくある。そのために「変数」という仕組みを使うよ！</p>
<h3 id="%E5%A4%89%E6%95%B0%E3%81%A8%E3%81%AF">変数とは？</h3>
<p><strong>例え話</strong>：変数は「ラベル付きの箱」みたいなもの！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">┌─────────────┐
│  name       │ ← 変数名（箱のラベル）
├─────────────┤
│  &quot;Alex&quot;     │ ← 値（箱の中身）
└─────────────┘
</code></pre>
<p><strong>箱にラベル（変数名）を付けて、中にデータ（値）を入れる。後でそのラベルを使って中身を取り出せる！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="let-%E3%81%A7%E5%A4%89%E6%95%B0%E3%82%92%E5%AE%A3%E8%A8%80%E3%81%99%E3%82%8B">let で変数を宣言する</h2>
<p><strong><code>let</code> は、後で値を変更できる変数を作る時に使うよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 変数を宣言して値を代入</span>
<span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age); <span class="hljs-comment">// → 25</span>

<span class="hljs-comment">// 後で値を変更できる</span>
age = <span class="hljs-number">26</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age); <span class="hljs-comment">// → 26</span>

age = <span class="hljs-number">30</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age); <span class="hljs-comment">// → 30</span>
</code></pre>
<p><strong><code>let</code> は「値が変わる可能性がある」時に使う！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="const-%E3%81%A7%E5%AE%9A%E6%95%B0%E3%82%92%E5%AE%A3%E8%A8%80%E3%81%99%E3%82%8B">const で定数を宣言する</h2>
<p><strong><code>const</code> は、一度決めたら変更できない定数を作る時に使うよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 定数を宣言</span>
<span class="hljs-keyword">const</span> country = <span class="hljs-string">&quot;日本&quot;</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(country); <span class="hljs-comment">// → 日本</span>

<span class="hljs-comment">// 変更しようとするとエラー！</span>
country = <span class="hljs-string">&quot;アメリカ&quot;</span>; <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Uncaught TypeError: Assignment to constant variable.</span>
</code></pre>
<p><strong><code>const</code> は「絶対に変わらない値」に使う！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="const-%E3%81%A8-let-%E3%81%AE%E4%BD%BF%E3%81%84%E5%88%86%E3%81%91">const と let の使い分け</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 誕生日は変わらない → const</span>
<span class="hljs-keyword">const</span> birthday = <span class="hljs-string">&quot;2000-01-01&quot;</span>;

<span class="hljs-comment">// 年齢は毎年変わる → let</span>
<span class="hljs-keyword">let</span> age = <span class="hljs-number">24</span>;

<span class="hljs-comment">// 名前は変わる可能性がある → let</span>
<span class="hljs-keyword">let</span> name = <span class="hljs-string">&quot;太郎&quot;</span>;
</code></pre>
<p><strong>基本的には <code>const</code> を使って、変更が必要な時だけ <code>let</code> を使うのがモダンな JavaScript の書き方！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%A4%89%E6%95%B0%E5%90%8D%E3%81%AE%E3%83%AB%E3%83%BC%E3%83%AB">変数名のルール</h2>
<p>変数名には、いくつかルールがあるよ：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 良い変数名</span>
<span class="hljs-keyword">let</span> userName = <span class="hljs-string">&quot;太郎&quot;</span>; <span class="hljs-comment">// キャメルケース（推奨）</span>
<span class="hljs-keyword">let</span> user_name = <span class="hljs-string">&quot;太郎&quot;</span>; <span class="hljs-comment">// スネークケース</span>
<span class="hljs-keyword">let</span> age2 = <span class="hljs-number">25</span>; <span class="hljs-comment">// 数字を含めてもOK</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> ダメな変数名</span>
<span class="hljs-keyword">let</span> 2age = <span class="hljs-number">25</span>; <span class="hljs-comment">// 数字から始まるのはNG</span>
<span class="hljs-keyword">let</span> user-name = <span class="hljs-string">&quot;太郎&quot;</span>; <span class="hljs-comment">// ハイフンはNG（ケバブケース）</span>
<span class="hljs-keyword">let</span> <span class="hljs-keyword">let</span> = <span class="hljs-string">&quot;test&quot;</span>; <span class="hljs-comment">// 予約語はNG</span>
</code></pre>
<p><strong>よく使われる命名規則</strong>：</p>
<ul>
<li><strong>キャメルケース</strong>（camelCase）：JavaScript の変数や関数名で最も一般的
<ul>
<li><code>userName</code>, <code>myAge</code>, <code>studentList</code></li>
</ul>
</li>
<li><strong>スクリーミングスネークケース</strong>（SCREAMING_SNAKE_CASE）：定数名に使われる
<ul>
<li><code>MAX_COUNT</code>, <code>API_KEY</code></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%87%E3%83%BC%E3%82%BF%E5%9E%8B%E3%83%87%E3%83%BC%E3%82%BF%E3%81%AE%E7%A8%AE%E9%A1%9E">データ型：データの種類</h2>
<p>JavaScript には、いろいろな種類のデータがあるよ！</p>
<ul>
<li>数値（Number）</li>
<li>文字列（String）</li>
<li>真偽値（Boolean）</li>
<li>null（ヌル）</li>
<li>undefined（未定義）</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="number---%E6%95%B0%E5%80%A4">Number - 数値</h2>
<p><strong>整数も小数も、全部 Number 型だよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>; <span class="hljs-comment">// 整数</span>
<span class="hljs-keyword">let</span> price = <span class="hljs-number">1980</span>; <span class="hljs-comment">// 整数</span>
<span class="hljs-keyword">let</span> temperature = -<span class="hljs-number">5</span>; <span class="hljs-comment">// 負の数</span>
<span class="hljs-keyword">let</span> pi = <span class="hljs-number">3.14</span>; <span class="hljs-comment">// 小数</span>
<span class="hljs-keyword">let</span> billion = <span class="hljs-number">1e9</span>; <span class="hljs-comment">// 指数表記（10億）</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age); <span class="hljs-comment">// → 25</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(pi); <span class="hljs-comment">// → 3.14</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(billion); <span class="hljs-comment">// → 1000000000</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="string---%E6%96%87%E5%AD%97%E5%88%97">String - 文字列</h2>
<p><strong>テキストデータは文字列型！シングルクォート <code>'</code> かダブルクォート <code>&quot;</code> で囲むよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> name = <span class="hljs-string">&quot;太郎&quot;</span>; <span class="hljs-comment">// ダブルクォート</span>
<span class="hljs-keyword">let</span> greeting = <span class="hljs-string">&quot;こんにちは&quot;</span>; <span class="hljs-comment">// ダブルクォート</span>
<span class="hljs-keyword">let</span> message = <span class="hljs-string">&#x27;Hello!&#x27;</span>; <span class="hljs-comment">// シングルクォートでもOK</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(name); <span class="hljs-comment">// → 太郎</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(greeting); <span class="hljs-comment">// → こんにちは</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(message); <span class="hljs-comment">// → Hello!</span>
</code></pre>
<p><strong>どちらを使ってもいいけど、プロジェクト内で統一するのがベスト！</strong><br />
文字列の中で<code>&quot;</code>を使う場合は、<code>'</code>で文字列を囲むよ。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> quote = <span class="hljs-string">&#x27;彼は&quot;こんにちは&quot;と言った。&#x27;</span>; <span class="hljs-comment">// 文字列の中でダブルクォートを使う</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(quote); <span class="hljs-comment">// → 彼は&quot;こんにちは&quot;と言った。</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="string---%E6%96%87%E5%AD%97%E5%88%97%E7%B6%9A%E3%81%8D">String - 文字列（続き）</h2>
<h3 id="%E6%96%87%E5%AD%97%E5%88%97%E3%81%AE%E9%80%A3%E7%B5%90">文字列の連結</h3>
<p><strong>文字列は <code>+</code> でつなげられるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> firstName = <span class="hljs-string">&quot;太郎&quot;</span>;
<span class="hljs-keyword">let</span> lastName = <span class="hljs-string">&quot;山田&quot;</span>;
<span class="hljs-keyword">let</span> fullName = lastName + <span class="hljs-string">&quot; &quot;</span> + firstName;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fullName); <span class="hljs-comment">// → 山田 太郎</span>
</code></pre>
<h3 id="%E3%82%A8%E3%82%B9%E3%82%B1%E3%83%BC%E3%83%97%E3%82%B7%E3%83%BC%E3%82%B1%E3%83%B3%E3%82%B9">エスケープシーケンス</h3>
<p><strong>文字列の中で特殊な文字を使うには、バックスラッシュ <code>\</code> を使うよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> multiLine = <span class="hljs-string">&quot;1行目\n2行目&quot;</span>; <span class="hljs-comment">// 改行</span>
<span class="hljs-keyword">let</span> tab = <span class="hljs-string">&quot;タブ\tスペース&quot;</span>; <span class="hljs-comment">// タブスペース</span>
<span class="hljs-keyword">let</span> path = <span class="hljs-string">&quot;C:\\Users\\name\\Desktop&quot;</span>; <span class="hljs-comment">// バックスラッシュ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(multiLine);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(tab);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(path);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="boolean---%E7%9C%9F%E5%81%BD%E5%80%A4">Boolean - 真偽値</h2>
<p><strong>true（真）か false（偽）の 2 つだけの値！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> isParent = <span class="hljs-literal">true</span>; <span class="hljs-comment">// 真</span>
<span class="hljs-keyword">let</span> isChild = <span class="hljs-literal">false</span>; <span class="hljs-comment">// 偽</span>

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(isParent); <span class="hljs-comment">// → true</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(isChild); <span class="hljs-comment">// → false</span>
</code></pre>
<p><strong>条件分岐（Lesson 2）で超重要になるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="null-%E3%81%A8-undefined">null と undefined</h2>
<h3 id="null%E3%83%8C%E3%83%AB">null（ヌル）</h3>
<p><strong>「意図的に値が無い」ことを示すよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> emptyValue = <span class="hljs-literal">null</span>; <span class="hljs-comment">// 意図的に空にしている</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(emptyValue); <span class="hljs-comment">// → null</span>
</code></pre>
<p><strong>例え話</strong>：「空っぽの箱を用意した」状態。</p>
<h3 id="undefined%E6%9C%AA%E5%AE%9A%E7%BE%A9">undefined（未定義）</h3>
<p><strong>「まだ値が入っていない」ことを示すよ。</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> notAssigned; <span class="hljs-comment">// 値を代入していない</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(notAssigned); <span class="hljs-comment">// → undefined</span>
</code></pre>
<p><strong>例え話</strong>：「箱のラベルだけ用意した」状態。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="typeof-%E6%BC%94%E7%AE%97%E5%AD%90">typeof 演算子</h2>
<p><strong><code>typeof</code> を使うと、変数のデータ型が分かるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>;
<span class="hljs-keyword">let</span> name = <span class="hljs-string">&quot;太郎&quot;</span>;
<span class="hljs-keyword">let</span> isAdult = <span class="hljs-literal">true</span>;
<span class="hljs-keyword">let</span> emptyValue = <span class="hljs-literal">null</span>;
<span class="hljs-keyword">let</span> notAssigned;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> age); <span class="hljs-comment">// → &quot;number&quot;</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> name); <span class="hljs-comment">// → &quot;string&quot;</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> isAdult); <span class="hljs-comment">// → &quot;boolean&quot;</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> emptyValue); <span class="hljs-comment">// → &quot;object&quot; （これはバグ！歴史的理由）</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">typeof</span> notAssigned); <span class="hljs-comment">// → &quot;undefined&quot;</span>
</code></pre>
<p><strong>デバッグする時に超便利！「この変数、何型だっけ？」って時に使おう！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E7%AE%97%E8%A1%93%E6%BC%94%E7%AE%97%E5%AD%90">算術演算子</h2>
<p><strong>数値の計算ができるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> a = <span class="hljs-number">10</span>;
<span class="hljs-keyword">let</span> b = <span class="hljs-number">3</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a + b); <span class="hljs-comment">// → 13 (足し算)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a - b); <span class="hljs-comment">// → 7 (引き算)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a * b); <span class="hljs-comment">// → 30 (掛け算)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a / b); <span class="hljs-comment">// → 3.3333... (割り算)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a % b); <span class="hljs-comment">// → 1 (余り)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a ** b); <span class="hljs-comment">// → 1000 (べき乗: 10の3乗)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A4%E3%83%B3%E3%82%AF%E3%83%AA%E3%83%A1%E3%83%B3%E3%83%88%E3%83%BB%E3%83%87%E3%82%AF%E3%83%AA%E3%83%A1%E3%83%B3%E3%83%88">インクリメント・デクリメント</h2>
<p><strong>値を 1 増やす/減らす便利な書き方！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> count = <span class="hljs-number">5</span>;

count++; <span class="hljs-comment">// count = count + 1 と同じ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(count); <span class="hljs-comment">// → 6</span>

count--; <span class="hljs-comment">// count = count - 1 と同じ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(count); <span class="hljs-comment">// → 5</span>

count += <span class="hljs-number">3</span>; <span class="hljs-comment">// count = count + 3 と同じ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(count); <span class="hljs-comment">// → 8</span>

count *= <span class="hljs-number">2</span>; <span class="hljs-comment">// count = count * 2 と同じ</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(count); <span class="hljs-comment">// → 16</span>
</code></pre>
<p><strong>ループでカウントする時によく使うよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%AF%94%E8%BC%83%E6%BC%94%E7%AE%97%E5%AD%90">比較演算子</h2>
<p><strong>2 つの値を比較して、true か false を返すよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> a = <span class="hljs-number">10</span>;
<span class="hljs-keyword">let</span> b = <span class="hljs-number">20</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a &lt; b); <span class="hljs-comment">// → true (aはbより小さい)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a &gt; b); <span class="hljs-comment">// → false (aはbより大きい)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a &lt;= <span class="hljs-number">10</span>); <span class="hljs-comment">// → true (aは10以下)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a &gt;= <span class="hljs-number">10</span>); <span class="hljs-comment">// → true (aは10以上)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a === <span class="hljs-number">10</span>); <span class="hljs-comment">// → true (aは10と等しい)</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a !== b); <span class="hljs-comment">// → true (aとbは等しくない)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%81%A8--%E3%81%AE%E9%81%95%E3%81%84%E8%B6%85%E9%87%8D%E8%A6%81">=== と == の違い（超重要！）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> num = <span class="hljs-number">5</span>;
<span class="hljs-keyword">let</span> str = <span class="hljs-string">&quot;5&quot;</span>;

<span class="hljs-comment">// == は型を変換して比較（あいまい）</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(num == str); <span class="hljs-comment">// → true （5と&quot;5&quot;を同じとみなす）</span>

<span class="hljs-comment">// === は型も含めて厳密に比較（推奨）</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(num === str); <span class="hljs-comment">// → false （5と&quot;5&quot;は型が違う）</span>
</code></pre>
<p><strong>必ず <code>===</code> と <code>!==</code> を使おう！<code>==</code> と <code>!=</code> は使わない！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E8%AB%96%E7%90%86%E6%BC%94%E7%AE%97%E5%AD%90">論理演算子</h2>
<p><strong>複数の条件を組み合わせる時に使うよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>;
<span class="hljs-keyword">let</span> hasLicense = <span class="hljs-literal">true</span>;

<span class="hljs-comment">// &amp;&amp; (AND): 両方trueならtrue</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age &gt;= <span class="hljs-number">18</span> &amp;&amp; hasLicense); <span class="hljs-comment">// → true</span>

<span class="hljs-comment">// || (OR): どちらかtrueならtrue</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(age &lt; <span class="hljs-number">18</span> || hasLicense); <span class="hljs-comment">// → true</span>

<span class="hljs-comment">// ! (NOT): trueとfalseを反転</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(!hasLicense); <span class="hljs-comment">// → false</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%86%E3%83%B3%E3%83%97%E3%83%AC%E3%83%BC%E3%83%88%E3%83%AA%E3%83%86%E3%83%A9%E3%83%AB%E6%96%87%E5%AD%97%E5%88%97%E3%82%92%E4%BE%BF%E5%88%A9%E3%81%AB%E6%89%B1%E3%81%86">テンプレートリテラル：文字列を便利に扱う</h2>
<p><strong>バッククォート <code>`</code> を使うと、文字列の中に変数を埋め込めるよ！</strong></p>
<h3 id="%E5%BE%93%E6%9D%A5%E3%81%AE%E6%9B%B8%E3%81%8D%E6%96%B9%E9%9D%A2%E5%80%92">従来の書き方（面倒...）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> name = <span class="hljs-string">&quot;太郎&quot;</span>;
<span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>;
<span class="hljs-keyword">let</span> message = <span class="hljs-string">&quot;こんにちは、&quot;</span> + name + <span class="hljs-string">&quot;さん。あなたは&quot;</span> + age + <span class="hljs-string">&quot;歳ですね。&quot;</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(message); <span class="hljs-comment">// → こんにちは、太郎さん。あなたは25歳ですね。</span>
</code></pre>
<p><strong><code>+</code> でつなげるのは面倒だし、読みにくい...</strong></p>
<h3 id="%E3%83%86%E3%83%B3%E3%83%97%E3%83%AC%E3%83%BC%E3%83%88%E3%83%AA%E3%83%86%E3%83%A9%E3%83%AB%E4%BE%BF%E5%88%A9">テンプレートリテラル（便利！）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> name = <span class="hljs-string">&quot;太郎&quot;</span>;
<span class="hljs-keyword">let</span> age = <span class="hljs-number">25</span>;
<span class="hljs-keyword">let</span> message = <span class="hljs-string">`こんにちは、<span class="hljs-subst">${name}</span>さん。あなたは<span class="hljs-subst">${age}</span>歳ですね。`</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(message); <span class="hljs-comment">// → こんにちは、太郎さん。あなたは25歳ですね。</span>
</code></pre>
<p><strong><code>${}</code> の中に変数を入れるだけ！読みやすくて書きやすい！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%86%E3%83%B3%E3%83%97%E3%83%AC%E3%83%BC%E3%83%88%E3%83%AA%E3%83%86%E3%83%A9%E3%83%AB%E3%81%AE%E4%BE%BF%E5%88%A9%E3%81%AA%E6%A9%9F%E8%83%BD">テンプレートリテラルの便利な機能</h2>
<h3 id="1-%E6%94%B9%E8%A1%8C%E3%81%8C%E7%B0%A1%E5%8D%98">1. 改行が簡単</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> multiLine = <span class="hljs-string">`これは
複数行の
文字列です。`</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(multiLine);
<span class="hljs-comment">// → これは</span>
<span class="hljs-comment">// 複数行の</span>
<span class="hljs-comment">// 文字列です。</span>
</code></pre>
<h3 id="2-%E5%BC%8F%E3%82%82%E5%9F%8B%E3%82%81%E8%BE%BC%E3%82%81%E3%82%8B">2. 式も埋め込める</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> price = <span class="hljs-number">1000</span>;
<span class="hljs-keyword">let</span> taxRate = <span class="hljs-number">0.1</span>;
<span class="hljs-keyword">let</span> message = <span class="hljs-string">`合計金額は<span class="hljs-subst">${price + price * taxRate}</span>円です。`</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(message); <span class="hljs-comment">// → 合計金額は1100円です。</span>

<span class="hljs-keyword">let</span> a = <span class="hljs-number">5</span>;
<span class="hljs-keyword">let</span> b = <span class="hljs-number">3</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${a}</span> + <span class="hljs-subst">${b}</span> = <span class="hljs-subst">${a + b}</span>`</span>); <span class="hljs-comment">// → 5 + 3 = 8</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B-1-%E7%B0%A1%E5%8D%98%E3%81%AA%E8%87%AA%E5%B7%B1%E7%B4%B9%E4%BB%8B">実践例 1: 簡単な自己紹介</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 変数を宣言</span>
<span class="hljs-keyword">const</span> name = <span class="hljs-string">&quot;山田太郎&quot;</span>;
<span class="hljs-keyword">const</span> age = <span class="hljs-number">25</span>;
<span class="hljs-keyword">const</span> country = <span class="hljs-string">&quot;日本&quot;</span>;
<span class="hljs-keyword">const</span> isStudent = <span class="hljs-literal">false</span>;

<span class="hljs-comment">// テンプレートリテラルで文字列を作成</span>
<span class="hljs-keyword">const</span> introduction = <span class="hljs-string">`こんにちは！私の名前は<span class="hljs-subst">${name}</span>です。
<span class="hljs-subst">${age}</span>歳で、<span class="hljs-subst">${country}</span>に住んでいます。
学生かどうか：<span class="hljs-subst">${isStudent}</span>`</span>;

<span class="hljs-comment">// コンソールに出力</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(introduction);

<span class="hljs-comment">// データ型も確認してみよう</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;名前の型:&quot;</span>, <span class="hljs-keyword">typeof</span> name); <span class="hljs-comment">// → string</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;年齢の型:&quot;</span>, <span class="hljs-keyword">typeof</span> age); <span class="hljs-comment">// → number</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;学生かの型:&quot;</span>, <span class="hljs-keyword">typeof</span> isStudent); <span class="hljs-comment">// → boolean</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B-2-%E7%B0%A1%E5%8D%98%E3%81%AA%E8%A8%88%E7%AE%97">実践例 2: 簡単な計算</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 商品の価格</span>
<span class="hljs-keyword">const</span> itemPrice = <span class="hljs-number">1500</span>;
<span class="hljs-keyword">const</span> quantity = <span class="hljs-number">3</span>;
<span class="hljs-keyword">const</span> taxRate = <span class="hljs-number">0.1</span>; <span class="hljs-comment">// 10%</span>

<span class="hljs-comment">// 計算</span>
<span class="hljs-keyword">const</span> subtotal = itemPrice * quantity; <span class="hljs-comment">// 小計</span>
<span class="hljs-keyword">const</span> tax = subtotal * taxRate; <span class="hljs-comment">// 消費税</span>
<span class="hljs-keyword">const</span> total = subtotal + tax; <span class="hljs-comment">// 合計</span>

<span class="hljs-comment">// 結果を表示</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;=== 購入明細 ===&quot;</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`商品単価: <span class="hljs-subst">${itemPrice}</span>円`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`数量: <span class="hljs-subst">${quantity}</span>個`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`小計: <span class="hljs-subst">${subtotal}</span>円`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`消費税(<span class="hljs-subst">${taxRate * <span class="hljs-number">100</span>}</span>%): <span class="hljs-subst">${tax}</span>円`</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`合計金額: <span class="hljs-subst">${total}</span>円`</span>);
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-1-javascript-%E5%9F%BA%E7%A4%8E%E6%96%87%E6%B3%95%E3%81%BE%E3%81%A8%E3%82%81">Lesson 1: JavaScript 基礎文法まとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>変数</strong>：<code>let</code> と <code>const</code> でデータを保存できる</li>
<li><strong>データ型</strong>：数値、文字列、真偽値、null、undefined がある</li>
<li><strong>typeof 演算子</strong>：変数の型を確認できる</li>
<li><strong>演算子</strong>：算術、比較、論理演算子でデータを操作できる</li>
<li><strong>テンプレートリテラル</strong>： <code>`</code> を使って文字列中に <code>${}</code> で変数を埋め込める</li>
<li><strong>console.log()</strong>：動作確認の必須ツール</li>
</ul>
<h3 id="%E9%87%8D%E8%A6%81%E3%81%AA%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88">重要なポイント</h3>
<ol>
<li><strong>基本は <code>const</code>、必要な時だけ <code>let</code></strong></li>
<li><strong>比較は必ず <code>===</code>, <code>!==</code> を使う（<code>==</code>, <code>!=</code> は使わない）</strong></li>
<li><strong>バッククォート <code>`</code> でテンプレートリテラル</strong></li>
<li><strong>console.log() でたくさん確認する</strong></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-2">Lesson 2</h1>
<h1 id="%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90%E3%81%A8%E3%83%AB%E3%83%BC%E3%83%97-%F0%9F%94%80-%F0%9F%94%81">条件分岐とループ <img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f500.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f501.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-2-%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90%E3%81%A8%E3%83%AB%E3%83%BC%E3%83%97-%F0%9F%94%80-%F0%9F%94%81-1">Lesson 2: 条件分岐とループ <img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f500.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f501.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：条件分岐で「もし〇〇なら××する」という処理を書けるようになり、ループで同じ処理を繰り返せるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90%E3%81%A8%E3%83%AB%E3%83%BC%E3%83%97%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ条件分岐とループを学ぶの？</h3>
<p>プログラミングの本当の力は、 <strong>「状況に応じて処理を変える」</strong> ことと、 <strong>「同じ処理を繰り返す」</strong> こと！</p>
<h3 id="%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90%E3%81%AE%E4%BE%8B">条件分岐の例</h3>
<ul>
<li>パスワードが正しければログイン成功、間違っていればエラー表示</li>
<li>点数が 80 点以上なら「合格」、そうでなければ「不合格」</li>
</ul>
<h3 id="%E3%83%AB%E3%83%BC%E3%83%97%E3%81%AE%E4%BE%8B">ループの例</h3>
<ul>
<li>1 から 100 までの数字を順番に表示</li>
<li>配列の中の要素を一つずつ処理</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90if-%E6%96%87">条件分岐：if 文</h2>
<p><strong>「もし〇〇なら××する」という処理を書けるよ！</strong></p>
<h3 id="if-%E6%96%87%E3%81%AE%E6%A7%8B%E9%80%A0">if 文の構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">if</span> (条件式) {
  <span class="hljs-comment">// 条件式がtrueの時に実行される処理</span>
}
</code></pre>
<div class="flex gap-x-1">
<div class="flex-1">
<h3 id="%E5%9F%BA%E6%9C%AC%E3%81%AE-if-%E6%96%87">基本の if 文</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> age = <span class="hljs-number">20</span>;

<span class="hljs-keyword">if</span> (age &gt;= <span class="hljs-number">18</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;成人です&quot;</span>);
}
</code></pre>
</div>
<div class="flex-1">
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">成人です
</code></pre>
</div>
</div>
<p><strong>例え話</strong>：まるで「もし雨が降っていたら、傘を持っていく」みたいな感じ！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="else%E3%81%9D%E3%81%86%E3%81%A7%E3%81%AA%E3%81%91%E3%82%8C%E3%81%B0">else：そうでなければ</h2>
<p><strong>条件が false の時の処理も書けるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> age = <span class="hljs-number">15</span>;

<span class="hljs-keyword">if</span> (age &gt;= <span class="hljs-number">18</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;成人です&quot;</span>);
} <span class="hljs-keyword">else</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;未成年です&quot;</span>);
}
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">未成年です
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="else-if%E8%A4%87%E6%95%B0%E3%81%AE%E6%9D%A1%E4%BB%B6">else if：複数の条件</h2>
<p><strong>3 つ以上の選択肢がある時に使うよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> score = <span class="hljs-number">75</span>;

<span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">80</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;優秀です！&quot;</span>);
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">60</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;合格です&quot;</span>);
} <span class="hljs-keyword">else</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;不合格です&quot;</span>);
}
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">合格です
</code></pre>
<p><strong>上から順番にチェックされて、最初に true になった処理だけが実行されるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E6%88%90%E7%B8%BE%E5%88%A4%E5%AE%9A">実践例：成績判定</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> score = <span class="hljs-number">92</span>;
<span class="hljs-keyword">let</span> grade;

<span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">90</span>) {
  grade = <span class="hljs-string">&quot;A&quot;</span>;
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">80</span>) {
  grade = <span class="hljs-string">&quot;B&quot;</span>;
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">70</span>) {
  grade = <span class="hljs-string">&quot;C&quot;</span>;
} <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (score &gt;= <span class="hljs-number">60</span>) {
  grade = <span class="hljs-string">&quot;D&quot;</span>;
} <span class="hljs-keyword">else</span> {
  grade = <span class="hljs-string">&quot;F&quot;</span>;
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`あなたの成績は <span class="hljs-subst">${grade}</span> です`</span>);
<span class="hljs-comment">// → あなたの成績は A です</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E4%B8%89%E9%A0%85%E6%BC%94%E7%AE%97%E5%AD%90%E7%9F%AD%E3%81%8F%E6%9B%B8%E3%81%91%E3%82%8B-if-else">三項演算子：短く書ける if-else</h2>
<p><strong>シンプルな if-else は、三項演算子で 1 行で書けるよ！</strong></p>
<h3 id="%E4%B8%89%E9%A0%85%E6%BC%94%E7%AE%97%E5%AD%90%E3%81%AE%E6%A7%8B%E9%80%A0">三項演算子の構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript">条件式 ? 真の時の値 : 偽の時の値;
</code></pre>
<p><strong>読み方</strong>：「もし条件式が true なら『真の時の値』、そうでなければ『偽の時の値』」</p>
<h3 id="%E4%B8%89%E9%A0%85%E6%BC%94%E7%AE%97%E5%AD%90%E3%82%92%E4%BD%BF%E3%81%A3%E3%81%9F%E6%9B%B8%E3%81%8D%E6%96%B9">三項演算子を使った書き方</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> age = <span class="hljs-number">20</span>;
<span class="hljs-keyword">const</span> status = age &gt;= <span class="hljs-number">18</span> ? <span class="hljs-string">&quot;成人&quot;</span> : <span class="hljs-string">&quot;未成年&quot;</span>;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(status); <span class="hljs-comment">// → 成人</span>
</code></pre>
<p><strong>シンプルな条件分岐には三項演算子が便利！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="switch-%E6%96%87%E8%A4%87%E6%95%B0%E3%81%AE%E5%80%A4%E3%81%A7%E5%88%86%E5%B2%90">switch 文：複数の値で分岐</h2>
<p><strong>ある変数の値によって処理を分ける時に使うよ！</strong></p>
<h3 id="switch-%E6%96%87%E3%81%AE%E6%A7%8B%E9%80%A0">switch 文の構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">switch</span> (式) {
  <span class="hljs-keyword">case</span> 値<span class="hljs-number">1</span>:
    <span class="hljs-comment">// 式が値1と一致した時の処理</span>
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> 値<span class="hljs-number">2</span>:
    <span class="hljs-comment">// 式が値2と一致した時の処理</span>
    <span class="hljs-keyword">break</span>;
  <span class="hljs-attr">default</span>:
    <span class="hljs-comment">// どの値にも一致しなかった時の処理</span>
}
</code></pre>
<p><strong>重要</strong>：各 <code>case</code> の最後に <code>break</code> を書かないと、次の <code>case</code> の処理も実行されちゃうよ！</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="switch-%E6%96%87%E8%A4%87%E6%95%B0%E3%81%AE%E5%80%A4%E3%81%A7%E5%88%86%E5%B2%90%E7%B6%9A%E3%81%8D">switch 文：複数の値で分岐（続き）</h2>
<h3 id="switch-%E6%96%87%E3%82%92%E4%BD%BF%E3%81%A3%E3%81%9F%E6%9B%B8%E3%81%8D%E6%96%B9">switch 文を使った書き方</h3>
<div class="columns-2">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> day = <span class="hljs-string">&quot;月曜日&quot;</span>;

<span class="hljs-keyword">switch</span> (day) {
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;月曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;週の始まり！がんばろう&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;火曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;まだまだ続く...&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;水曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;折り返し地点&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;木曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;もう少し&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;金曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;明日は休み！&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;土曜日&quot;</span>:
  <span class="hljs-keyword">case</span> <span class="hljs-string">&quot;日曜日&quot;</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;週末だ！&quot;</span>);
    <span class="hljs-keyword">break</span>;
  <span class="hljs-attr">default</span>:
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;不明な曜日&quot;</span>);
}
</code></pre>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="for-%E3%83%AB%E3%83%BC%E3%83%97%E5%9B%9E%E6%95%B0%E3%82%92%E6%8C%87%E5%AE%9A%E3%81%97%E3%81%A6%E7%B9%B0%E3%82%8A%E8%BF%94%E3%81%99">for ループ：回数を指定して繰り返す</h2>
<p><strong>決まった回数だけ処理を繰り返すよ！</strong></p>
<h3 id="for-%E3%83%AB%E3%83%BC%E3%83%97%E3%81%AE%E6%A7%8B%E9%80%A0">for ループの構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (初期化; 条件式; 増減式) {
  <span class="hljs-comment">// 条件式がtrueの間、繰り返される処理</span>
}
</code></pre>
<p><strong>各部分の役割</strong>：</p>
<ol>
<li><strong>初期化</strong>：<code>let i = 0</code> - ループ開始前に 1 回だけ実行</li>
<li><strong>条件式</strong>：<code>i &lt; 5</code> - 毎回チェックして、true なら処理を実行</li>
<li><strong>増減式</strong>：<code>i++</code> - 処理が終わるたびに実行</li>
</ol>
<p><strong>まるで「カウントダウンタイマー」みたいな仕組み！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="for-%E3%83%AB%E3%83%BC%E3%83%97%E5%9B%9E%E6%95%B0%E3%82%92%E6%8C%87%E5%AE%9A%E3%81%97%E3%81%A6%E7%B9%B0%E3%82%8A%E8%BF%94%E3%81%99%E7%B6%9A%E3%81%8D">for ループ：回数を指定して繰り返す（続き）</h2>
<h3 id="%E5%9F%BA%E6%9C%AC%E3%81%AE-for-%E3%83%AB%E3%83%BC%E3%83%97">基本の for ループ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">5</span>; i++) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`現在のiは <span class="hljs-subst">${i}</span> です`</span>);
}
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">現在のiは 0 です
現在のiは 1 です
現在のiは 2 です
現在のiは 3 です
現在のiは 4 です
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="while-%E3%83%AB%E3%83%BC%E3%83%97%E6%9D%A1%E4%BB%B6%E3%81%8C-true-%E3%81%AE%E9%96%93%E7%B9%B0%E3%82%8A%E8%BF%94%E3%81%99">while ループ：条件が true の間繰り返す</h2>
<p><strong>条件式が true の間、ずっと繰り返すよ！</strong></p>
<h3 id="while-%E3%83%AB%E3%83%BC%E3%83%97%E3%81%AE%E6%A7%8B%E9%80%A0">while ループの構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">while</span> (条件式) {
  <span class="hljs-comment">// 条件式がtrueの間、繰り返される処理</span>
}
</code></pre>
<p><strong>注意</strong>：条件式がずっと true だと、<strong>無限ループ</strong>になっちゃう！</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 無限ループ（避けよう！）</span>
<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>;
<span class="hljs-keyword">while</span> (i &lt; <span class="hljs-number">5</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i);
  <span class="hljs-comment">// i++を忘れている！iがずっと0のまま</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="while-%E3%83%AB%E3%83%BC%E3%83%97%E6%9D%A1%E4%BB%B6%E3%81%8C-true-%E3%81%AE%E9%96%93%E7%B9%B0%E3%82%8A%E8%BF%94%E3%81%99%E7%B6%9A%E3%81%8D">while ループ：条件が true の間繰り返す（続き）</h2>
<h3 id="%E5%9F%BA%E6%9C%AC%E3%81%AE-while-%E3%83%AB%E3%83%BC%E3%83%97">基本の while ループ</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">let</span> count = <span class="hljs-number">0</span>;

<span class="hljs-keyword">while</span> (count &lt; <span class="hljs-number">5</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`現在のcountは <span class="hljs-subst">${count}</span> です`</span>);
  count++;
}
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">現在のcountは 0 です
現在のcountは 1 です
現在のcountは 2 です
現在のcountは 3 です
現在のcountは 4 です
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="break%E3%83%AB%E3%83%BC%E3%83%97%E3%82%92%E9%80%94%E4%B8%AD%E3%81%A7%E6%8A%9C%E3%81%91%E3%82%8B">break：ループを途中で抜ける</h2>
<p><strong>ループの途中で強制的に終了できるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">10</span>; i++) {
  <span class="hljs-keyword">if</span> (i === <span class="hljs-number">5</span>) {
    <span class="hljs-keyword">break</span>; <span class="hljs-comment">// iが5になったらループを抜ける</span>
  }
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i);
}
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;ループ終了&quot;</span>);
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">0
1
2
3
4
ループ終了
</code></pre>
<p><strong><code>break</code> を使うと、その時点でループが終了する！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="continue%E3%81%9D%E3%81%AE%E5%9B%9E%E3%81%AE%E5%87%A6%E7%90%86%E3%82%92%E3%82%B9%E3%82%AD%E3%83%83%E3%83%97">continue：その回の処理をスキップ</h2>
<p><strong>その回の処理をスキップして、次のループへ進むよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">0</span>; i &lt; <span class="hljs-number">10</span>; i++) {
  <span class="hljs-keyword">if</span> (i % <span class="hljs-number">2</span> === <span class="hljs-number">0</span>) {
    <span class="hljs-keyword">continue</span>; <span class="hljs-comment">// 偶数の時はスキップ</span>
  }
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i); <span class="hljs-comment">// 奇数だけ出力</span>
}
</code></pre>
<p><strong>出力</strong>：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1
3
5
7
9
</code></pre>
<p><strong><code>continue</code> を使うと、その回の処理だけスキップして次へ進む！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8Bfizzbuzz">実践例：FizzBuzz</h2>
<p><strong>プログラミングの定番問題！</strong></p>
<p>1 から 30 までの数字を表示するけど：</p>
<ul>
<li>3 の倍数の時は「Fizz」</li>
<li>5 の倍数の時は「Buzz」</li>
<li>3 と 5 の両方の倍数の時は「FizzBuzz」</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">for</span> (<span class="hljs-keyword">let</span> i = <span class="hljs-number">1</span>; i &lt;= <span class="hljs-number">30</span>; i++) {
  <span class="hljs-keyword">if</span> (i % <span class="hljs-number">3</span> === <span class="hljs-number">0</span> &amp;&amp; i % <span class="hljs-number">5</span> === <span class="hljs-number">0</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;FizzBuzz&quot;</span>);
  } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (i % <span class="hljs-number">3</span> === <span class="hljs-number">0</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Fizz&quot;</span>);
  } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (i % <span class="hljs-number">5</span> === <span class="hljs-number">0</span>) {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Buzz&quot;</span>);
  } <span class="hljs-keyword">else</span> {
    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(i);
  }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-2-%E6%9D%A1%E4%BB%B6%E5%88%86%E5%B2%90%E3%81%A8%E3%83%AB%E3%83%BC%E3%83%97%E3%81%BE%E3%81%A8%E3%82%81">Lesson 2: 条件分岐とループまとめ</h2>
<p>このレッスンで学んだこと：</p>
<ul>
<li><strong>if 文</strong>：条件が true の時に処理を実行</li>
<li><strong>else if, else</strong>：複数の条件で分岐（<strong>厳しい条件から先にチェック</strong>）</li>
<li><strong>三項演算子</strong>：シンプルな if-else を 1 行で</li>
<li><strong>switch 文</strong>：値によって処理を分ける（<strong>break を忘れずに</strong>）</li>
<li><strong>for ループ</strong>：決まった回数繰り返す</li>
<li><strong>while ループ</strong>：条件が true の間繰り返す（<strong>無限ループに注意</strong>）</li>
<li><strong>break</strong>：ループを途中で抜ける</li>
<li><strong>continue</strong>：その回だけスキップ</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-class="center" data-theme="udemy" data-lang="ja" lang="ja" class="center" style="--class:center;--theme:udemy;--lang:ja;">
<h1 id="lesson-3">Lesson 3</h1>
<h1 id="%E9%96%A2%E6%95%B0%E3%81%AE%E5%9F%BA%E6%9C%AC-%F0%9F%94%A7">関数の基本 <img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f527.svg" data-marp-twemoji=""/></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="lesson-3-%E9%96%A2%E6%95%B0%E3%81%AE%E5%9F%BA%E6%9C%AC-%F0%9F%94%A7-1">Lesson 3: 関数の基本 <img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f527.svg" data-marp-twemoji=""/></h2>
<p><strong>学習目標</strong>：関数を使ってコードをまとめて再利用できるようになり、引数と戻り値を理解してより実践的なプログラムが書けるようになる</p>
<h3 id="%E3%81%AA%E3%81%9C%E9%96%A2%E6%95%B0%E3%82%92%E5%AD%A6%E3%81%B6%E3%81%AE">なぜ関数を学ぶの？</h3>
<p>同じようなコードを何度も書くのは面倒だし、読みにくいし、間違いも起こりやすい...</p>
<p><strong>関数を使えば、コードをまとめて名前を付けて、何度でも呼び出せるよ！</strong></p>
<h3 id="%E9%96%A2%E6%95%B0%E3%81%AE%E3%83%A1%E3%83%AA%E3%83%83%E3%83%88">関数のメリット</h3>
<ul>
<li>同じコードを何度も書かなくていい（DRY: Don't Repeat Yourself）</li>
<li>コードが読みやすくなる（処理に名前が付く）</li>
<li>バグが減る（1 箇所修正すればOK）</li>
<li>テストしやすくなる</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%96%A2%E6%95%B0%E5%AE%A3%E8%A8%80%E5%9F%BA%E6%9C%AC%E3%81%AE%E6%9B%B8%E3%81%8D%E6%96%B9">関数宣言：基本の書き方</h2>
<h3 id="%E9%96%A2%E6%95%B0%E5%AE%A3%E8%A8%80%E3%81%AE%E6%A7%8B%E9%80%A0">関数宣言の構造</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> 関数名() {
  <span class="hljs-comment">// 実行したい処理</span>
}
</code></pre>
<p><strong>重要なポイント</strong>：</p>
<ul>
<li><code>function</code> キーワードで関数を宣言</li>
<li>関数名は「何をするか」が分かる名前にする</li>
<li><code>()</code> の後に <code>{}</code> で処理を囲む</li>
<li>呼び出す時は <code>関数名()</code> と書く</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%96%A2%E6%95%B0%E5%AE%A3%E8%A8%80%E5%9F%BA%E6%9C%AC%E3%81%AE%E6%9B%B8%E3%81%8D%E6%96%B9%E7%B6%9A%E3%81%8D">関数宣言：基本の書き方（続き）</h2>
<h3 id="%E6%9C%80%E3%82%82%E3%82%B7%E3%83%B3%E3%83%97%E3%83%AB%E3%81%AA%E9%96%A2%E6%95%B0">最もシンプルな関数</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 関数を宣言（定義）</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">sayHello</span>(<span class="hljs-params"></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;こんにちは！&quot;</span>);
}

<span class="hljs-comment">// 関数を呼び出す（実行）</span>
<span class="hljs-title function_">sayHello</span>(); <span class="hljs-comment">// → こんにちは！</span>
<span class="hljs-title function_">sayHello</span>(); <span class="hljs-comment">// → こんにちは！</span>
<span class="hljs-title function_">sayHello</span>(); <span class="hljs-comment">// → こんにちは！</span>
</code></pre>
<p><strong>関数を一度定義すれば、何度でも呼び出せる！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%BC%95%E6%95%B0%E9%96%A2%E6%95%B0%E3%81%AB%E5%80%A4%E3%82%92%E6%B8%A1%E3%81%99">引数：関数に値を渡す</h2>
<p><strong>関数に値を渡して、それを使って処理できるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 引数nameを受け取る関数</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">greet</span>(<span class="hljs-params">name</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`こんにちは、<span class="hljs-subst">${name}</span>さん！`</span>);
}

<span class="hljs-comment">// 関数を呼び出す時に値を渡す</span>
<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;太郎&quot;</span>); <span class="hljs-comment">// → こんにちは、太郎さん！</span>
<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;花子&quot;</span>); <span class="hljs-comment">// → こんにちは、花子さん！</span>
<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;次郎&quot;</span>); <span class="hljs-comment">// → こんにちは、次郎さん！</span>
</code></pre>
<p><strong>同じ関数でも、引数を変えれば違う結果が得られる！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E8%A4%87%E6%95%B0%E3%81%AE%E5%BC%95%E6%95%B0">複数の引数</h2>
<p><strong>複数の値を受け取ることもできるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">introduce</span>(<span class="hljs-params">name, age, city</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`私は<span class="hljs-subst">${name}</span>です。<span class="hljs-subst">${age}</span>歳で、<span class="hljs-subst">${city}</span>に住んでいます。`</span>);
}

<span class="hljs-title function_">introduce</span>(<span class="hljs-string">&quot;太郎&quot;</span>, <span class="hljs-number">25</span>, <span class="hljs-string">&quot;東京&quot;</span>);
<span class="hljs-comment">// → 私は太郎です。25歳で、東京に住んでいます。</span>

<span class="hljs-title function_">introduce</span>(<span class="hljs-string">&quot;花子&quot;</span>, <span class="hljs-number">22</span>, <span class="hljs-string">&quot;大阪&quot;</span>);
<span class="hljs-comment">// → 私は花子です。22歳で、大阪に住んでいます。</span>
</code></pre>
<p><strong>複数の引数は、カンマ <code>,</code> で区切るよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88%E5%BC%95%E6%95%B0">デフォルト引数</h2>
<p><strong>引数が渡されなかった時のデフォルト値を設定できるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">greet</span>(<span class="hljs-params">name = <span class="hljs-string">&quot;ゲスト&quot;</span></span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`こんにちは、<span class="hljs-subst">${name}</span>さん！`</span>);
}

<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;太郎&quot;</span>); <span class="hljs-comment">// → こんにちは、太郎さん！</span>
<span class="hljs-title function_">greet</span>(); <span class="hljs-comment">// → こんにちは、ゲストさん！（デフォルト値が使われる）</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E6%88%BB%E3%82%8A%E5%80%A4%E9%96%A2%E6%95%B0%E3%81%8B%E3%82%89%E5%80%A4%E3%82%92%E8%BF%94%E3%81%99">戻り値：関数から値を返す</h2>
<p><strong>関数は処理した結果を返すことができるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">add</span>(<span class="hljs-params">a, b</span>) {
  <span class="hljs-keyword">return</span> a + b; <span class="hljs-comment">// 結果を返す</span>
}

<span class="hljs-comment">// 戻り値を変数に代入</span>
<span class="hljs-keyword">const</span> result = <span class="hljs-title function_">add</span>(<span class="hljs-number">5</span>, <span class="hljs-number">3</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(result); <span class="hljs-comment">// → 8</span>

<span class="hljs-comment">// 直接使うこともできる</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">add</span>(<span class="hljs-number">10</span>, <span class="hljs-number">20</span>)); <span class="hljs-comment">// → 30</span>
</code></pre>
<p><strong><code>return</code> で値を返すと、その値を別の処理で使えるよ！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="return-%E3%81%A7%E9%96%A2%E6%95%B0%E3%82%92%E7%B5%82%E4%BA%86">return で関数を終了</h2>
<p><strong><code>return</code> を実行すると、その時点で関数が終了するよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">function</span> <span class="hljs-title function_">checkAge</span>(<span class="hljs-params">age</span>) {
  <span class="hljs-keyword">if</span> (age &lt; <span class="hljs-number">0</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;エラー: 年齢は0以上である必要があります&quot;</span>;
  }

  <span class="hljs-keyword">if</span> (age &lt; <span class="hljs-number">18</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;未成年です&quot;</span>;
  }

  <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;成人です&quot;</span>;
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">checkAge</span>(-<span class="hljs-number">5</span>)); <span class="hljs-comment">// → エラー: 年齢は0以上である必要があります</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">checkAge</span>(<span class="hljs-number">15</span>)); <span class="hljs-comment">// → 未成年です</span>
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">checkAge</span>(<span class="hljs-number">20</span>)); <span class="hljs-comment">// → 成人です</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E9%96%A2%E6%95%B0%E5%BC%8F%E9%96%A2%E6%95%B0%E3%82%92%E5%A4%89%E6%95%B0%E3%81%AB%E4%BB%A3%E5%85%A5%E3%81%99%E3%82%8B">関数式：関数を変数に代入する</h2>
<p><strong>関数を変数に代入することもできるよ！</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">const</span> greet = <span class="hljs-keyword">function</span> (<span class="hljs-params">name</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`こんにちは、<span class="hljs-subst">${name}</span>さん！`</span>);
};

<span class="hljs-title function_">greet</span>(<span class="hljs-string">&quot;太郎&quot;</span>); <span class="hljs-comment">// → こんにちは、太郎さん！</span>
</code></pre>
<p><strong>関数宣言と関数式の違い</strong>：</p>
<ul>
<li><strong>関数宣言</strong>：宣言前でも呼び出せる</li>
<li><strong>関数式</strong>：変数に代入されるので、宣言後にしか呼び出せない</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A2%E3%83%AD%E3%83%BC%E9%96%A2%E6%95%B0%E7%9F%AD%E3%81%8F%E6%9B%B8%E3%81%91%E3%82%8B%E9%96%A2%E6%95%B0">アロー関数：短く書ける関数</h2>
<p><strong>ES6 で追加された、関数をもっと短く書ける方法！</strong></p>
<h3 id="%E5%9F%BA%E6%9C%AC%E3%81%AE%E6%9B%B8%E3%81%8D%E6%96%B9">基本の書き方</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 関数宣言</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">add1</span>(<span class="hljs-params">a, b</span>) {
  <span class="hljs-keyword">return</span> a + b;
}

<span class="hljs-comment">// 関数式</span>
<span class="hljs-keyword">const</span> add2 = <span class="hljs-keyword">function</span> (<span class="hljs-params">a, b</span>) {
  <span class="hljs-keyword">return</span> a + b;
};

<span class="hljs-comment">// アロー関数</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">add3</span> = (<span class="hljs-params">a, b</span>) =&gt; {
  <span class="hljs-keyword">return</span> a + b;
};

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">add3</span>(<span class="hljs-number">5</span>, <span class="hljs-number">3</span>)); <span class="hljs-comment">// → 8</span>
</code></pre>
<p><strong><code>function</code> を <code>=&gt;</code> に置き換えて、もっとシンプルに！</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E3%82%A2%E3%83%AD%E3%83%BC%E9%96%A2%E6%95%B0%E3%81%AE%E7%9C%81%E7%95%A5%E8%A8%98%E6%B3%95">アロー関数の省略記法</h2>
<h3 id="1-%E5%BC%95%E6%95%B0%E3%81%8C-1-%E3%81%A4%E3%81%AE%E6%99%82%E3%81%AF--%E3%82%92%E7%9C%81%E7%95%A5%E3%81%A7%E3%81%8D%E3%82%8B">1. 引数が 1 つの時は <code>()</code> を省略できる</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 通常</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">double1</span> = (<span class="hljs-params">n</span>) =&gt; {
  <span class="hljs-keyword">return</span> n * <span class="hljs-number">2</span>;
};
<span class="hljs-comment">// 省略</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">double2</span> = n =&gt; {
  <span class="hljs-keyword">return</span> n * <span class="hljs-number">2</span>;
};
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">double2</span>(<span class="hljs-number">5</span>)); <span class="hljs-comment">// → 10</span>
</code></pre>
<h3 id="2-%E5%87%A6%E7%90%86%E3%81%8C-1-%E8%A1%8C%E3%81%A0%E3%81%91%E3%81%AA%E3%82%89--%E3%81%A8-return-%E3%82%92%E7%9C%81%E7%95%A5%E3%81%A7%E3%81%8D%E3%82%8B">2. 処理が 1 行だけなら <code>{}</code> と <code>return</code> を省略できる</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 通常</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">square1</span> = (<span class="hljs-params">n</span>) =&gt; {
  <span class="hljs-keyword">return</span> n * n;
};
<span class="hljs-comment">// 省略</span>
<span class="hljs-keyword">const</span> <span class="hljs-title function_">square2</span> = n =&gt; n * n;

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">square2</span>(<span class="hljs-number">4</span>)); <span class="hljs-comment">// → 16</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-theme="udemy" data-lang="ja" lang="ja" style="--theme:udemy;--lang:ja;">
<h2 id="%E5%AE%9F%E8%B7%B5%E4%BE%8B%E8%A4%87%E6%95%B0%E3%81%AE%E9%96%A2%E6%95%B0%E3%82%92%E7%B5%84%E3%81%BF%E5%90%88%E3%82%8F%E3%81%9B%E3%82%8B">実践例：複数の関数を組み合わせる</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-comment">// 消費税を計算</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">calculateTax</span>(<span class="hljs-params">price, rate</span>) {
  <span class="hljs-keyword">return</span> price * rate;
}

<span class="hljs-comment">// 割引を計算</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">calculateDiscount</span>(<span class="hljs-params">price, discountRate</span>) {
  <span class="hljs-keyword">return</span> price * discountRate;
}

<span class="hljs-comment">// 最終価格を計算</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">calculateFinalPrice</span>(<span class="hljs-params">price, taxRate = <span class="hljs-number">0.1</span>, discountRate = <span class="hljs-number">0</span></span>) {
  <span class="hljs-keyword">const</span> discount = <span class="hljs-title function_">calculateDiscount</span>(price, discountRate);
  <span class="hljs-keyword">const</span> priceAfterDiscount = price - discount;
  <span class="hljs-keyword">const</span> tax = <span class="hljs-title function_">calculateTax</span>(priceAfterDiscount, taxRate);
  <span class="hljs-keyword">return</span> priceAfterDiscount + tax;
}

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-title function_">calculateFinalPrice</span>(<span class="hljs-number">10000</span>)); <span class="hljs-comment">// → 11000</span>
